name: CI/CD Pipeline with Shipwright

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  SHIPWRIGHT_VERSION: "latest"  # or pin to specific version like "v1.0.0"

jobs:
  # Stage 1: Setup - Prepare environment and dependencies
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Shipwright Setup
        uses: ./.github/actions/shipwright
        with:
          version: ${{ env.SHIPWRIGHT_VERSION }}
          pipeline: go-service
          stage: setup
          config: .shipwright.yml
          env: dev
          verbose: true

  # Stage 2: Build - Compile the application
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Shipwright Build
        uses: ./.github/actions/shipwright
        with:
          version: ${{ env.SHIPWRIGHT_VERSION }}
          pipeline: go-service
          stage: build
          config: .shipwright.yml
          env: dev
          verbose: true
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/
            dist/
          retention-days: 7

  # Stage 3: Test - Run tests and coverage
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Shipwright Test
        uses: ./.github/actions/shipwright
        with:
          version: ${{ env.SHIPWRIGHT_VERSION }}
          pipeline: go-service
          stage: test
          config: .shipwright.yml
          env: dev
          coverage: 90
          verbose: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 30

  # Stage 4: Security - Run security scans
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Shipwright Security
        uses: ./.github/actions/shipwright
        with:
          version: ${{ env.SHIPWRIGHT_VERSION }}
          pipeline: go-service
          stage: security
          config: .shipwright.yml
          env: dev
          verbose: true

  # Stage 5: Package - Create distributable artifacts
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Shipwright Package
        uses: ./.github/actions/shipwright
        with:
          version: ${{ env.SHIPWRIGHT_VERSION }}
          pipeline: go-service
          stage: package
          config: .shipwright.yml
          env: production
          verbose: true

  # Stage 6: Push - Push to container registry
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Shipwright Push
        uses: ./.github/actions/shipwright
        with:
          version: ${{ env.SHIPWRIGHT_VERSION }}
          pipeline: go-service
          stage: push
          config: .shipwright.yml
          env: production
          verbose: true
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  # Alternative: Execute full pipeline in one job
  full-pipeline:
    name: Full Pipeline (Alternative)
    runs-on: ubuntu-latest
    if: false  # Disabled by default, enable if needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Full Shipwright Pipeline
        uses: ./.github/actions/shipwright
        with:
          version: ${{ env.SHIPWRIGHT_VERSION }}
          pipeline: go-service
          # stage is empty, so full pipeline will run
          config: .shipwright.yml
          env: dev
          coverage: 90
          verbose: true
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

