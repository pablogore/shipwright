# GoReleaser configuration for shipwright
# https://goreleaser.com/

# providers/go/vX.Y.Z tags (design.md D6) must never be considered as the
# root module's "previous tag" -- they belong to a disjoint release line
# published by .github/workflows/release-provider-go.yml, not GoReleaser.
git:
  ignore_tags:
    - 'providers/*'

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.Commit}}
    binary: shipwright
    # Rename binaries to include platform info for direct download
    id: default

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'

# After build, we'll use a hook to publish raw binaries with correct names
# This is handled in the release workflow

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'
  use: git

release:
  github:
    owner: pablogore
    name: shipwright
  draft: false
  prerelease: auto
  name_template: "Release {{ .Tag }}"
  header: |
    ## 🚀 Release {{ .Tag }}
    
    This release includes the following changes:
  footer: |
    ## 📦 Installation
    
    Download the appropriate binary for your platform and architecture.
    
    ### Direct Binary Download (Recommended for CI/CD)
    
    Download the binary directly without extracting:
    
    ```bash
    # Linux/macOS
    curl -L https://github.com/pablogore/shipwright/releases/download/{{ .Tag }}/shipwright-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/amd64/') -o shipwright
    chmod +x shipwright
    sudo mv shipwright /usr/local/bin/
    ```
    
    Available binaries:
    - `shipwright-linux-amd64` - Linux AMD64
    - `shipwright-linux-arm64` - Linux ARM64
    - `shipwright-darwin-amd64` - macOS AMD64
    - `shipwright-darwin-arm64` - macOS ARM64
    - `shipwright-windows-amd64.exe` - Windows AMD64
    
    ### Archive Download
    
    Or download the full archive:
    
    ```bash
    # Linux/macOS
    curl -L https://github.com/pablogore/shipwright/releases/download/{{ .Tag }}/shipwright_{{ .Version }}_$(uname -s)_$(uname -m).tar.gz | tar xz
    sudo mv shipwright /usr/local/bin/
    
    # Windows
    # Download the .zip file and extract shipwright.exe
    ```
    
    ### For CI/CD Usage
    
    Services can download and use the binary directly in their pipelines:
    
    ```yaml
    - name: Download Shipwright
      run: |
        curl -L https://github.com/pablogore/shipwright/releases/download/{{ .Tag }}/shipwright-linux-amd64 -o shipwright
        chmod +x shipwright
    ```

