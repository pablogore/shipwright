# GoReleaser configuration for syntegrity-dagger
# https://goreleaser.com/

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    binary: syntegrity-dagger

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'
  use: git

release:
  github:
    owner: getsyntegrity
    name: syntegrity-dagger
  draft: false
  prerelease: auto
  name_template: "Release {{ .Tag }}"
  header: |
    ## 🚀 Release {{ .Tag }}
    
    This release includes the following changes:
  footer: |
    ## 📦 Installation
    
    Download the appropriate binary for your platform and architecture.
    
    ### Quick Install
    
    ```bash
    # Linux/macOS
    curl -L https://github.com/getsyntegrity/syntegrity-dagger/releases/download/{{ .Tag }}/syntegrity-dagger_{{ .Version }}_$(uname -s)_$(uname -m).tar.gz | tar xz
    sudo mv syntegrity-dagger /usr/local/bin/
    
    # Windows
    # Download the .zip file and extract syntegrity-dagger.exe
    ```

dockers:
  - image_templates:
      - "ghcr.io/getsyntegrity/syntegrity-dagger:{{ .Version }}"
      - "ghcr.io/getsyntegrity/syntegrity-dagger:latest"
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/getsyntegrity/syntegrity-dagger
      - --label=org.opencontainers.image.source=https://github.com/getsyntegrity/syntegrity-dagger
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT