# GoReleaser configuration for syntegrity-dagger
# https://goreleaser.com/

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.Commit}}
    binary: syntegrity-dagger
    # Rename binaries to include platform info for direct download
    id: default

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'

# After build, we'll use a hook to publish raw binaries with correct names
# This is handled in the release workflow

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'
  use: git

release:
  github:
    owner: getsyntegrity
    name: syntegrity-dagger
  draft: false
  prerelease: auto
  name_template: "Release {{ .Tag }}"
  header: |
    ## 🚀 Release {{ .Tag }}
    
    This release includes the following changes:
  footer: |
    ## 📦 Installation
    
    Download the appropriate binary for your platform and architecture.
    
    ### Direct Binary Download (Recommended for CI/CD)
    
    Download the binary directly without extracting:
    
    ```bash
    # Linux/macOS
    curl -L https://github.com/getsyntegrity/syntegrity-dagger/releases/download/{{ .Tag }}/syntegrity-dagger-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/amd64/') -o syntegrity-dagger
    chmod +x syntegrity-dagger
    sudo mv syntegrity-dagger /usr/local/bin/
    ```
    
    Available binaries:
    - `syntegrity-dagger-linux-amd64` - Linux AMD64
    - `syntegrity-dagger-linux-arm64` - Linux ARM64
    - `syntegrity-dagger-darwin-amd64` - macOS AMD64
    - `syntegrity-dagger-darwin-arm64` - macOS ARM64
    - `syntegrity-dagger-windows-amd64.exe` - Windows AMD64
    
    ### Archive Download
    
    Or download the full archive:
    
    ```bash
    # Linux/macOS
    curl -L https://github.com/getsyntegrity/syntegrity-dagger/releases/download/{{ .Tag }}/syntegrity-dagger_{{ .Version }}_$(uname -s)_$(uname -m).tar.gz | tar xz
    sudo mv syntegrity-dagger /usr/local/bin/
    
    # Windows
    # Download the .zip file and extract syntegrity-dagger.exe
    ```
    
    ### For CI/CD Usage
    
    Services can download and use the binary directly in their pipelines:
    
    ```yaml
    - name: Download Syntegrity Dagger
      run: |
        curl -L https://github.com/getsyntegrity/syntegrity-dagger/releases/download/{{ .Tag }}/syntegrity-dagger-linux-amd64 -o syntegrity-dagger
        chmod +x syntegrity-dagger
    ```

dockers:
  - image_templates:
      - "ghcr.io/getsyntegrity/syntegrity-dagger:{{ .Version }}"
      - "ghcr.io/getsyntegrity/syntegrity-dagger:latest"
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/getsyntegrity/syntegrity-dagger
      - --label=org.opencontainers.image.source=https://github.com/getsyntegrity/syntegrity-dagger
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT

