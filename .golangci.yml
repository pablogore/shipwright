version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - gocritic
    - gocyclo
    - misspell
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - tagliatelle
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wastedassign
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use errors.New() instead
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog instead
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - noctx
          - perfsprint
        path: _test\.go
      - path: third_party$
        text: .*
      - path: builtin$
        text: .*
      - path: examples$
        text: .*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
