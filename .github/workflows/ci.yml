name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v0.1.0)'
        required: false
        default: ''
      release_type:
        description: 'Release type'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - prerelease
      prerelease_type:
        description: 'Pre-release type (if applicable)'
        required: false
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.1'
  BINARY_NAME: 'syntegrity-dagger'
  RELEASE_DIR: 'release'
  CACHE_VERSION: v1

jobs:
  # Stage 1: Determine pipeline type and version
  determine-pipeline:
    runs-on: ubuntu-latest
    # Skip CI for tag pushes (handled by release workflow)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      pipeline-type: ${{ steps.determine.outputs.type }}
      run-security: ${{ steps.determine.outputs.security }}
      run-coverage: ${{ steps.determine.outputs.coverage }}
      is-release: ${{ steps.determine.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Determine pipeline type
      id: determine
      run: |
        echo "🔍 Analyzing pipeline context..."
        echo "Event: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Base ref: ${{ github.base_ref }}"
        echo "Commit message: ${{ github.event.head_commit.message }}"
        
        # Determine pipeline type based on context
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "type=pr" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Pull Request (full pipeline)"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "type=main" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=true" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Main branch (full pipeline + release)"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "type=develop" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Develop branch (CI/CD only, no releases)"
        else
          echo "type=feature" >> $GITHUB_OUTPUT
          echo "security=false" >> $GITHUB_OUTPUT
          echo "coverage=false" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Feature branch (basic pipeline)"
        fi
        
    - name: Determine version
      id: version
      run: |
        echo "🏷️ Determining version..."
        
        # Check if version is provided via workflow_dispatch
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
          VERSION="${{ github.event.inputs.version }}"
          echo "Using provided version: $VERSION"
        else
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Latest tag: $LATEST_TAG"
          
          if [[ -n "$LATEST_TAG" ]]; then
            # Extract version number
            VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
            echo "Version number: $VERSION_NUMBER"
            
            # Determine version bump based on commit messages
            COMMITS=$(git log --oneline $LATEST_TAG..HEAD)
            echo "Commits since $LATEST_TAG:"
            echo "$COMMITS"
          else
            # No tags exist, start from v0.0.0
            VERSION_NUMBER="0.0.0"
            echo "No tags found, starting from v0.0.0"
            
            # Get all commits
            COMMITS=$(git log --oneline --max-count=10)
            echo "Recent commits:"
            echo "$COMMITS"
          fi
          
          # Check for conventional commits
          if echo "$COMMITS" | grep -q "feat!:\|BREAKING CHANGE"; then
            # Major version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1+1".0.0"}')
            echo "Major version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "feat:"; then
            # Minor version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2+1".0"}')
            echo "Minor version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "fix:"; then
            # Patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Patch version bump: $VERSION"
          else
            # Default to patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Default patch version bump: $VERSION"
          fi
        fi
        
        # Determine if this is a prerelease
        if [[ "${{ steps.determine.outputs.type }}" == "develop" ]]; then
          # Get prerelease type
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.prerelease_type }}" ]]; then
            PRERELEASE_TYPE="${{ github.event.inputs.prerelease_type }}"
          else
            PRERELEASE_TYPE="beta"
          fi
          
          # Get prerelease number
          PRERELEASE_NUM=$(git tag | grep "v$VERSION-$PRERELEASE_TYPE" | wc -l)
          PRERELEASE_NUM=$((PRERELEASE_NUM + 1))
          
          FULL_VERSION="v$VERSION-$PRERELEASE_TYPE.$PRERELEASE_NUM"
          TAG="$FULL_VERSION"
          echo "Pre-release version: $FULL_VERSION"
        else
          FULL_VERSION="v$VERSION"
          TAG="$FULL_VERSION"
          echo "Release version: $FULL_VERSION"
        fi
        
        echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "✅ Version determined: $FULL_VERSION"
        
    - name: Generate changelog
      id: changelog
      run: |
        echo "📝 Generating changelog..."
        
        # Get latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [[ -n "$LATEST_TAG" ]]; then
          # Generate changelog since last tag
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $LATEST_TAG..HEAD)
        else
          # Generate changelog for all commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=10)
        fi
        
        # Save changelog to file
        echo "$CHANGELOG" > CHANGELOG.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Changelog generated"

  # Stage 2: Build and Test (Parallel)
  build:
    runs-on: ubuntu-latest
    needs: determine-pipeline
    if: ${{ always() && (needs.determine-pipeline.result == 'success' || needs.determine-pipeline.outputs.pipeline-type == 'pr') }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Build
      run: |
        echo "🔨 Building application..."
        go build -o ${{ env.BINARY_NAME }} .
        echo "✅ Build completed"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BINARY_NAME }}-${{ runner.os }}-${{ runner.arch }}
        path: ${{ env.BINARY_NAME }}
        retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: determine-pipeline
    if: ${{ always() && (needs.determine-pipeline.result == 'success' || needs.determine-pipeline.outputs.pipeline-type == 'pr') }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Run tests
      run: |
        echo "🧪 Running tests..."
        go test -v ./...
        echo "✅ Tests completed"

  security:
    runs-on: ubuntu-latest
    needs: determine-pipeline
    if: ${{ needs.determine-pipeline.outputs.run-security == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Run security scan
      run: |
        echo "🔒 Running security scan..."
        # Use go vet for basic security checks
        go vet ./...
        # Check for common security issues
        go list -json -deps ./... | grep -i "crypto\|hash\|rand" || true
        echo "✅ Security scan completed"

  # Stage 3: Release (Only for main branch)
  release:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, build, test]
    if: ${{ needs.determine-pipeline.outputs.is-release == 'true' && needs.build.result == 'success' && needs.test.result == 'success' && needs.determine-pipeline.outputs.pipeline-type == 'main' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Build multi-platform binaries
      run: |
        echo "🔨 Building multi-platform binaries..."
        
        # Create release directory
        mkdir -p ${{ env.RELEASE_DIR }}
        
        # Build for different platforms
        GOOS=linux GOARCH=amd64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-linux-amd64 .
        GOOS=linux GOARCH=arm64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-linux-arm64 .
        GOOS=darwin GOARCH=amd64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-darwin-amd64 .
        GOOS=darwin GOARCH=arm64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-darwin-arm64 .
        GOOS=windows GOARCH=amd64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-windows-amd64.exe .
        
        echo "✅ Multi-platform build completed"
        
    - name: Create release
      run: |
        echo "🚀 Creating release ${{ needs.determine-pipeline.outputs.tag }}..."
        
        # Create tag if it doesn't exist
        if ! git tag -l | grep -q "^${{ needs.determine-pipeline.outputs.tag }}$"; then
          git tag -a "${{ needs.determine-pipeline.outputs.tag }}" -m "Release ${{ needs.determine-pipeline.outputs.tag }}"
          git push origin "${{ needs.determine-pipeline.outputs.tag }}"
          echo "✅ Tag created and pushed"
        else
          echo "⚠️ Tag already exists"
        fi
        
        # Create release
        gh release create "${{ needs.determine-pipeline.outputs.tag }}" \
          --title "Release ${{ needs.determine-pipeline.outputs.tag }}" \
          --notes "${{ needs.determine-pipeline.outputs.changelog }}" \
          ${{ env.RELEASE_DIR }}/*
          
        echo "✅ Release created"
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ needs.determine-pipeline.outputs.tag }}
        path: ${{ env.RELEASE_DIR }}/*
        retention-days: 30
