name: CI/CD Pipeline

# This workflow runs when:
# 1. Push to main or develop branches (includes PR merges)
# 2. Pull requests targeting main or develop (for pre-merge validation)
# 3. Manual trigger via workflow_dispatch
# Note: PR merges trigger push events, so we handle both to avoid duplicates
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # Required to trigger workflow_dispatch

env:
  GO_VERSION: '1.25.5'
  CACHE_VERSION: v1

jobs:
  # Stage 1: Determine pipeline type and configuration
  determine-pipeline:
    runs-on: ubuntu-latest
    # Skip CI for tag pushes (handled by release workflow)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      pipeline-type: ${{ steps.determine.outputs.type }}
      run-security: ${{ steps.determine.outputs.security }}
      run-coverage: ${{ steps.determine.outputs.coverage }}
      is-release: ${{ steps.determine.outputs.release }}
    steps:
    - name: Determine pipeline type
      id: determine
      run: |
        echo "🔍 Analyzing pipeline context..."
        echo "Event: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Base ref: ${{ github.base_ref }}"
        echo "Commit message: ${{ github.event.head_commit.message }}"
        
        # Determine pipeline type based on context
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # Pull request: full pipeline with security and coverage checks
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          if [[ "$BASE_BRANCH" == "main" ]]; then
            echo "type=pr-main" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to main (full pipeline with security and coverage)"
          elif [[ "$BASE_BRANCH" == "develop" ]]; then
            echo "type=pr-develop" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to develop (full pipeline with security and coverage)"
          else
            echo "type=pr" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to other branch (full pipeline)"
          fi
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          # Main branch: full pipeline + release
          echo "type=main" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=true" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Main branch (full pipeline + release)"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          # Develop branch: full pipeline only
          echo "type=develop" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Develop branch (full pipeline)"
        else
          echo "type=feature" >> $GITHUB_OUTPUT
          echo "security=false" >> $GITHUB_OUTPUT
          echo "coverage=false" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Feature branch (lightweight pipeline)"
        fi

  # Stage 2: Setup and Dependencies (always runs)
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # For PRs, checkout the PR head commit
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SYNTEGRITY_DAGGER_TOKEN secret with a token that has 'repo' scope"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            echo "Please configure SYNTEGRITY_DAGGER_TOKEN secret in repository settings"
            exit 1
          fi
        fi
        
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Configure Git authentication with token (escape special characters)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Verify authentication setup
        echo "✅ Git and Go configured for private repos"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "Git URL config:"
        git config --global --get-regexp url || echo "No URL config found"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        # Clean any existing module cache to avoid conflicts
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache cleaned"
        
    - name: Cache Go modules                                                      
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Download dependencies
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "📦 Downloading Go dependencies..."
        
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SYNTEGRITY_DAGGER_TOKEN secret with a token that has 'repo' scope"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            echo "Please configure SYNTEGRITY_DAGGER_TOKEN secret in repository settings"
            exit 1
          fi
        fi
        
        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Test authentication before downloading
        echo "Testing GitHub authentication..."
        if git ls-remote --heads "https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" > /dev/null 2>&1; then
          echo "✅ Authentication test successful"
        else
          echo "⚠️ Authentication test failed - token may not have access to private repository"
          echo "⚠️ This will likely cause 'go mod download' to fail"
          echo "⚠️ Consider configuring SYNTEGRITY_DAGGER_TOKEN with a token that has 'repo' scope"
        fi
        
        # Download dependencies with error handling
        if ! go mod download; then
          echo "❌ Failed to download dependencies"
          echo ""
          echo "🔍 Debugging information:"
          echo "GOPRIVATE: $(go env GOPRIVATE)"
          echo "Git URL config:"
          git config --global --get-regexp url || echo "No URL config found"
          echo ""
          echo "Testing GitHub access with token..."
          if git ls-remote --heads "https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" > /dev/null 2>&1; then
            echo "✅ Token has access to repository"
          else
            echo "❌ Token does not have access to repository"
            echo ""
            echo "💡 Solution:"
            echo "1. Create a Personal Access Token (PAT) with 'repo' scope at:"
            echo "   https://github.com/settings/tokens"
            echo "2. Add it as a secret named 'SYNTEGRITY_DAGGER_TOKEN' in:"
            echo "   Repository Settings → Secrets and variables → Actions"
            echo "3. The token must have access to the private repository:"
            echo "   github.com/getsyntegrity/go-kit-logger"
            echo ""
            echo "⚠️ GITHUB_TOKEN (default) does not have access to private organization repositories"
          fi
          exit 1
        fi
        echo "✅ Dependencies downloaded"
      
    - name: Verify dependencies
      run: |
        echo "🔍 Verifying dependencies..."
        go mod verify
        echo "✅ Dependencies verified"

  # Stage 3: Build (runs in parallel with tests and lint)
  build:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, setup]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # For PRs, checkout the PR head commit
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SYNTEGRITY_DAGGER_TOKEN secret with a token that has 'repo' scope"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            echo "Please configure SYNTEGRITY_DAGGER_TOKEN secret in repository settings"
            exit 1
          fi
        fi
        
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Configure Git authentication with token (escape special characters)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Verify authentication setup
        echo "✅ Git and Go configured for private repos"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "Git URL config:"
        git config --global --get-regexp url || echo "No URL config found"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        sudo rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache and VCS cache cleaned"
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Build
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "🔨 Building application..."
        
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            exit 1
          fi
        fi
        
        # Clean VCS cache to remove any cached unauthenticated URLs
        echo "🧹 Cleaning Go VCS cache..."
        rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true
        
        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Verify Go environment
        echo "📋 Go environment:"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "GONOPROXY: $(go env GONOPROXY)"
        echo "GONOSUMDB: $(go env GONOSUMDB)"
        
        # Verify authentication before building (non-blocking)
        echo "🔍 Testing authentication..."
        echo "Testing access to private repository..."
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          echo "⚠️ Warning: SYNTEGRITY_DAGGER_TOKEN is empty"
        else
          echo "Token is set (length: ${#SYNTEGRITY_DAGGER_TOKEN} characters)"
          # Use || true to ensure this never fails the script
          AUTH_TEST=$(git ls-remote --heads "https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" 2>&1) || true
          AUTH_EXIT_CODE=$?
          
          if [ $AUTH_EXIT_CODE -eq 0 ]; then
            echo "✅ Authentication verified via git ls-remote"
          else
            echo "⚠️ Warning: git ls-remote test failed (exit code: $AUTH_EXIT_CODE)"
            echo "Error output: $AUTH_TEST"
            echo ""
            echo "📋 This is a warning, not an error. Go may still be able to download modules using:"
            echo "   - .netrc file authentication"
            echo "   - Git URL rewrite configuration"
            echo "   - Go's built-in authentication mechanisms"
            echo ""
            echo "Continuing with build - go build will test actual module access..."
          fi
        fi
        
        go build ./...

  # Stage 4: Tests (runs in parallel with build)
  test:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, setup]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # For PRs, checkout the PR head commit
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SYNTEGRITY_DAGGER_TOKEN secret with a token that has 'repo' scope"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            echo "Please configure SYNTEGRITY_DAGGER_TOKEN secret in repository settings"
            exit 1
          fi
        fi
        
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Configure Git authentication with token (escape special characters)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Verify authentication setup
        echo "✅ Git and Go configured for private repos"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "Git URL config:"
        git config --global --get-regexp url || echo "No URL config found"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        sudo rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache and VCS cache cleaned"
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Run tests
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "🧪 Running tests..."
        
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            exit 1
          fi
        fi
        
        # Clean VCS cache to remove any cached unauthenticated URLs
        echo "🧹 Cleaning Go VCS cache..."
        rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true
        
        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Verify authentication before running tests (non-blocking)
        echo "🔍 Testing authentication..."
        echo "Testing access to private repository..."
        # Use || true to ensure this never fails the script
        AUTH_TEST=$(git ls-remote --heads "https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" 2>&1) || true
        AUTH_EXIT_CODE=$?
        
        if [ $AUTH_EXIT_CODE -eq 0 ]; then
          echo "✅ Authentication verified"
        else
          echo "⚠️ Warning: Authentication test failed (exit code: $AUTH_EXIT_CODE)"
          echo "Error output: $AUTH_TEST"
          echo ""
          echo "⚠️ Continuing with tests anyway - authentication may work for go mod download"
        fi
        
        # Exclude examples and mocks directories from test coverage
        TEST_PACKAGES=$(go list ./... | grep -v "/examples" | grep -v "/mocks")
        if [[ "${{ needs.determine-pipeline.outputs.pipeline-type }}" == "feature" ]]; then
          echo "📋 Feature branch: Running basic tests"
          go test -race $TEST_PACKAGES
        else
          echo "📋 Main/Develop/PR: Running full test suite with coverage"
          go test -race -coverprofile=coverage.out $TEST_PACKAGES
        fi

  # Stage 5: Security (only for main/develop/PRs)
  security:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, build, test]
    if: needs.determine-pipeline.outputs.run-security == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # For PRs, checkout the PR head commit
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SYNTEGRITY_DAGGER_TOKEN secret with a token that has 'repo' scope"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            echo "Please configure SYNTEGRITY_DAGGER_TOKEN secret in repository settings"
            exit 1
          fi
        fi
        
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Configure Git authentication with token (escape special characters)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Verify authentication setup
        echo "✅ Git and Go configured for private repos"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "Git URL config:"
        git config --global --get-regexp url || echo "No URL config found"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        sudo rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache and VCS cache cleaned"
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Check for vulnerabilities
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "🔒 Running security scan..."
        
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            exit 1
          fi
        fi
        
        # Clean VCS cache to remove any cached unauthenticated URLs
        echo "🧹 Cleaning Go VCS cache..."
        rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true
        
        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/".insteadOf "git@github.com:"
        
        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SYNTEGRITY_DAGGER_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc
        
        # Verify authentication before installing tools (non-blocking)
        echo "🔍 Testing authentication..."
        echo "Testing access to private repository..."
        # Use || true to ensure this never fails the script
        AUTH_TEST=$(git ls-remote --heads "https://x-access-token:${SYNTEGRITY_DAGGER_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" 2>&1) || true
        AUTH_EXIT_CODE=$?
        
        if [ $AUTH_EXIT_CODE -eq 0 ]; then
          echo "✅ Authentication verified"
        else
          echo "⚠️ Warning: Authentication test failed (exit code: $AUTH_EXIT_CODE)"
          echo "Error output: $AUTH_TEST"
          echo ""
          echo "⚠️ Continuing with security scan anyway - authentication may work for go mod download"
        fi
        
        echo "📋 Go version: $(go version)"
        go install golang.org/x/vuln/cmd/govulncheck@latest
        
        # Run vulnerability check and capture output
        govulncheck ./... > vuln_report.txt 2>&1 || true
        
        # Check if there are vulnerabilities in dependencies (not stdlib)
        if grep -q "Your code is affected" vuln_report.txt; then
          # Check if vulnerabilities are only in stdlib
          if grep -q "Standard library" vuln_report.txt && ! grep -q "packages you import" vuln_report.txt; then
            echo "⚠️ Vulnerabilities found in Go standard library"
            echo "📋 These should be fixed by updating Go version"
            echo "📋 Current Go version: $(go version)"
            cat vuln_report.txt
            echo ""
            echo "❌ Security scan failed: Go standard library vulnerabilities detected."
            echo "💡 Solution: Update Go to the latest patch version (1.25.3 or newer)"
            exit 1
          else
            echo "❌ Security vulnerabilities detected in dependencies!"
            cat vuln_report.txt
            exit 1
          fi
        elif grep -q "No vulnerabilities found" vuln_report.txt; then
          echo "✅ No security vulnerabilities found."
        else
          # Show report for debugging
          cat vuln_report.txt
          echo "✅ Security scan completed."
        fi

  # Stage 6: Trigger release workflow for develop->main merges
  trigger-release:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, security]
    if: |
      needs.determine-pipeline.outputs.is-release == 'true' &&
      needs.determine-pipeline.outputs.pipeline-type == 'main' &&
      github.event_name != 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      
    - name: Detect source branch
      id: detect-source
      run: |
        # Detect source branch from merge commit message
        SOURCE_BRANCH=""
        MERGE_COMMIT=$(git log -1 --pretty=%B)
        if echo "$MERGE_COMMIT" | grep -qE "Merge pull request|Merge branch"; then
          SOURCE_BRANCH=$(echo "$MERGE_COMMIT" | grep -oE "from [^ ]+" | sed 's/from //' || echo "")
        fi
        if [[ -z "$SOURCE_BRANCH" ]]; then
          SOURCE_BRANCH=$(git log --oneline -10 | grep -iE "hotfix|develop" | head -1 | grep -oE "(hotfix|develop)[^ ]*" | head -1 || echo "")
        fi
        
        if [[ "$SOURCE_BRANCH" == "develop" ]] || echo "$SOURCE_BRANCH" | grep -qiE "^develop"; then
          echo "✅ Merge from develop detected: $SOURCE_BRANCH"
          echo "should_trigger=true" >> $GITHUB_OUTPUT
        else
          echo "⏭️ Merge is not from develop (detected: $SOURCE_BRANCH) - skipping release trigger"
          echo "should_trigger=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Trigger release workflow
      if: steps.detect-source.outputs.should_trigger == 'true'
      uses: actions/github-script@v7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_PAT || secrets.SYNTEGRITY_DAGGER_TOKEN }}
      with:
        github-token: ${{ secrets.GITHUB_PAT || secrets.SYNTEGRITY_DAGGER_TOKEN }}
        script: |
          // Trigger release workflow with workflow_dispatch to use latest main version
          const currentSha = context.sha;
          console.log(`🚀 Triggering release workflow for commit ${currentSha} (develop->main merge)`);
          
          try {
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main', // Always use main branch to get latest workflow version
              inputs: {
                commit_sha: currentSha // Pass the CI commit SHA for checkout
              }
            });
            console.log(`✅ Release workflow triggered successfully`);
          } catch (error) {
            // If workflow is already running, GitHub will return an error
            // This is acceptable - the release will still proceed
            if (error.status === 422 || error.message.includes('already running')) {
              console.log(`ℹ️ Release workflow may already be running for this commit`);
              console.log(`   This is normal - the release will proceed`);
            } else {
              console.error(`❌ Error triggering release workflow: ${error.message}`);
              throw error;
            }
          }