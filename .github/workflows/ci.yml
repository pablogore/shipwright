name: CI/CD Pipeline

# This workflow runs when:
# 1. Push to main or develop branches (includes PR merges)
# 2. Manual trigger via workflow_dispatch
# Note: PR merges trigger push events, so we only need push trigger
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GO_VERSION: '1.25.5'
  CACHE_VERSION: v1

jobs:
  # Stage 1: Determine pipeline type and configuration
  determine-pipeline:
    runs-on: ubuntu-latest
    # Skip CI for tag pushes (handled by release workflow)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      pipeline-type: ${{ steps.determine.outputs.type }}
      run-security: ${{ steps.determine.outputs.security }}
      run-coverage: ${{ steps.determine.outputs.coverage }}
      is-release: ${{ steps.determine.outputs.release }}
    steps:
    - name: Determine pipeline type
      id: determine
      run: |
        echo "🔍 Analyzing pipeline context..."
        echo "Event: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Base ref: ${{ github.base_ref }}"
        echo "Commit message: ${{ github.event.head_commit.message }}"
        
        # Determine pipeline type based on context
        # Note: PR merges now trigger push events, so we detect them via merge commits
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          # Main branch: full pipeline + release
          echo "type=main" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=true" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Main branch (full pipeline + release)"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          # Develop branch: full pipeline only
          echo "type=develop" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Develop branch (full pipeline)"
        else
          echo "type=feature" >> $GITHUB_OUTPUT
          echo "security=false" >> $GITHUB_OUTPUT
          echo "coverage=false" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Feature branch (lightweight pipeline)"
        fi

  # Stage 2: Setup and Dependencies (always runs)
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      run: |
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}" >> ~/.netrc
        chmod 600 ~/.netrc
        # Configure Git authentication
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "git@github.com:"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        # Clean any existing module cache to avoid conflicts
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache cleaned"
        
    - name: Cache Go modules                                                      
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Download dependencies
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      run: |
        echo "📦 Downloading Go dependencies..."
        go mod download
        echo "✅ Dependencies downloaded"
      
    - name: Verify dependencies
      run: |
        echo "🔍 Verifying dependencies..."
        go mod verify
        echo "✅ Dependencies verified"

  # Stage 3: Build (runs in parallel with tests and lint)
  build:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, setup]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      run: |
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}" >> ~/.netrc
        chmod 600 ~/.netrc
        # Configure Git authentication
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "git@github.com:"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache cleaned"
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Build
      run: |
        echo "🔨 Building application..."
        go build ./...

  # Stage 4: Tests (runs in parallel with build)
  test:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, setup]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      run: |
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}" >> ~/.netrc
        chmod 600 ~/.netrc
        # Configure Git authentication
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "git@github.com:"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache cleaned"
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Run tests
      run: |
        echo "🧪 Running tests..."
        # Exclude examples and mocks directories from test coverage
        TEST_PACKAGES=$(go list ./... | grep -v "/examples" | grep -v "/mocks")
        if [[ "${{ needs.determine-pipeline.outputs.pipeline-type }}" == "feature" ]]; then
          echo "📋 Feature branch: Running basic tests"
          go test -race $TEST_PACKAGES
        else
          echo "📋 Main/Develop/PR: Running full test suite with coverage"
          go test -race -coverprofile=coverage.out $TEST_PACKAGES
        fi
      
    - name: Upload coverage
      if: needs.determine-pipeline.outputs.run-coverage == 'true'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        fail_ci_if_error: false

  # Stage 5: Security (only for main/develop/PRs)
  security:
    runs-on: ubuntu-latest
    needs: [determine-pipeline, build, test]
    if: needs.determine-pipeline.outputs.run-security == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      run: |
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}" >> ~/.netrc
        chmod 600 ~/.netrc
        # Configure Git authentication
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "git@github.com:"
        
    - name: Clean Go module cache
      run: |
        echo "🧹 Cleaning Go module cache..."
        sudo rm -rf ~/go/pkg/mod 2>/dev/null || true
        sudo rm -rf ~/.cache/go-build 2>/dev/null || true
        mkdir -p ~/go/pkg/mod
        mkdir -p ~/.cache/go-build
        echo "✅ Go module cache cleaned"
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
          
    - name: Check for vulnerabilities
      run: |
        echo "🔒 Running security scan..."
        echo "📋 Go version: $(go version)"
        go install golang.org/x/vuln/cmd/govulncheck@latest
        
        # Run vulnerability check and capture output
        govulncheck ./... > vuln_report.txt 2>&1 || true
        
        # Check if there are vulnerabilities in dependencies (not stdlib)
        if grep -q "Your code is affected" vuln_report.txt; then
          # Check if vulnerabilities are only in stdlib
          if grep -q "Standard library" vuln_report.txt && ! grep -q "packages you import" vuln_report.txt; then
            echo "⚠️ Vulnerabilities found in Go standard library"
            echo "📋 These should be fixed by updating Go version"
            echo "📋 Current Go version: $(go version)"
            cat vuln_report.txt
            echo ""
            echo "❌ Security scan failed: Go standard library vulnerabilities detected."
            echo "💡 Solution: Update Go to the latest patch version (1.25.3 or newer)"
            exit 1
          else
            echo "❌ Security vulnerabilities detected in dependencies!"
            cat vuln_report.txt
            exit 1
          fi
        elif grep -q "No vulnerabilities found" vuln_report.txt; then
          echo "✅ No security vulnerabilities found."
        else
          # Show report for debugging
          cat vuln_report.txt
          echo "✅ Security scan completed."
        fi