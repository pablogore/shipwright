name: CI/CD Pipeline

# This workflow runs when:
# 1. Push to main or develop branches (includes PR merges)
# 2. Pull requests targeting main or develop (for pre-merge validation)
# 3. Branch deletion events (to prevent deletion of protected branches)
# 4. Manual trigger via workflow_dispatch
# Note: PR merges trigger push events, so we handle both to avoid duplicates
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
  delete:
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # Required to trigger workflow_dispatch

env:
  GO_VERSION: '1.25.5'
  CACHE_VERSION: v1

jobs:
  # Stage -1: Prevent deletion of protected branches
  prevent-branch-deletion:
    runs-on: ubuntu-latest
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    steps:
    - name: Prevent branch deletion
      env:
        BRANCH: ${{ github.event.ref }}
        REF_TYPE: ${{ github.event.ref_type }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        # For delete events, github.event.ref_name doesn't exist
        # We must use github.event.ref and extract the branch name from it
        # SECURITY: Using env: block prevents shell injection from branch names
        
        # Extract branch name from ref (e.g., "refs/heads/main" -> "main")
        if [[ "$BRANCH" =~ ^refs/heads/(.+)$ ]]; then
          BRANCH_NAME="${BASH_REMATCH[1]}"
        elif [[ "$BRANCH" =~ ^refs/tags/(.+)$ ]]; then
          # This is a tag, not a branch
          BRANCH_NAME=""
        else
          # Safer fallback: strip "refs/" prefix if present, otherwise use as-is
          # This preserves branch names with slashes (e.g., "feature/main" stays as "feature/main")
          # Using ${BRANCH#refs/} instead of ${BRANCH##*/} prevents truncating branch names
          BRANCH_NAME="${BRANCH#refs/}"
        fi
        
        # Validate that branch name was extracted correctly
        if [[ -z "$BRANCH_NAME" ]]; then
          echo "❌ ERROR: Failed to extract branch name from ref: $BRANCH"
          echo "Cannot determine branch name - failing to prevent potential branch deletion"
          exit 1
        fi
        
        # Only check for branches (not tags)
        if [[ "$REF_TYPE" != "branch" ]]; then
          echo "✅ Deletion is for a tag, not a branch - allowing"
          exit 0
        fi
        
        # Check if it's a protected branch
        # CRITICAL: Use BRANCH_NAME (extracted from github.event.ref), not github.event.ref_name
        if [[ "$BRANCH_NAME" != "main" ]] && [[ "$BRANCH_NAME" != "develop" ]]; then
          echo "✅ Branch '$BRANCH_NAME' is not protected - deletion allowed"
          exit 0
        fi
        
        # If we get here, it's an attempt to delete a protected branch
        echo "⚠️ WARNING: Attempt to delete protected branch detected!"
        echo ""
        echo "🚫 Protected branches (main, develop) CANNOT be deleted under any circumstances"
        echo ""
        echo "📋 Branch information:"
        echo "   - Branch ref: $BRANCH"
        echo "   - Branch name: $BRANCH_NAME"
        echo "   - Ref type: $REF_TYPE"
        echo "   - Actor: $GITHUB_ACTOR"
        echo "   - Event: $GITHUB_EVENT_NAME"
        echo ""
        echo "🔒 Branch protection rules prevent deletion of:"
        echo "   - main"
        echo "   - develop"
        echo ""
        echo "💡 If you need to restore a branch:"
        echo "   - Contact repository administrators"
        echo "   - Use git reflog to find the commit SHA"
        echo "   - Restore the branch from a backup or previous commit"
        echo ""
        echo "✅ Branch deletion prevented - workflow continues (branch was not deleted)"
        exit 0

  # Stage 0: Verify no direct pushes to protected branches
  verify-branch-protection:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Verify branch protection
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_EVENT_COMMITS: ${{ toJSON(github.event.commits) }}
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        # Only check for direct pushes, PRs are allowed
        if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
          echo "✅ Not a direct push (event: $GITHUB_EVENT_NAME) - branch protection check skipped"
          exit 0
        fi
        
        BRANCH="$GITHUB_REF_NAME"
        
        # Skip check for non-protected branches
        if [[ "$BRANCH" != "main" ]] && [[ "$BRANCH" != "develop" ]]; then
          echo "✅ Branch '$BRANCH' is not protected - direct push allowed"
          exit 0
        fi
        
        # Check if this push is from a PR merge (squash/merge/rebase)
        # When a PR is merged, GitHub creates a commit that may have PR information
        # We check multiple indicators to determine if this is a merge from a PR
        
        IS_PR_MERGE=false
        COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA")
        COMMIT_AUTHOR=$(git log -1 --pretty=%an "$GITHUB_SHA")
        
        # Method 1: Check if commit message contains PR reference or merge keywords
        if echo "$COMMIT_MSG" | grep -qiE "(#[0-9]+|Merge pull request|Merge branch|Squash and merge|from [^ ]+ into)"; then
          echo "📋 Commit message indicates PR merge: $(echo "$COMMIT_MSG" | head -1)"
          IS_PR_MERGE=true
        fi
        
        # Method 2: Check if commit has multiple parents (merge commit, not squash)
        PARENT_COUNT=$(git rev-list --count "$GITHUB_SHA^..$GITHUB_SHA" 2>/dev/null || echo "0")
        if [[ "$PARENT_COUNT" -gt 1 ]]; then
          echo "📋 Commit has multiple parents (merge commit)"
          IS_PR_MERGE=true
        fi
        
        # Method 3: Check if there are multiple commits in this push (indicates merge)
        # Note: github.event.commits is a JSON array, we need to pass it via env
        COMMIT_COUNT=$(echo "$GITHUB_EVENT_COMMITS" | jq '. | length' 2>/dev/null || echo "0")
        if [[ "$COMMIT_COUNT" -gt 1 ]]; then
          echo "📋 Multiple commits in push (likely from PR merge)"
          IS_PR_MERGE=true
        fi
        
        # Method 4: Check if author is GitHub (common for automated merges)
        if [[ "$COMMIT_AUTHOR" == "GitHub" ]] || [[ "$COMMIT_AUTHOR" == *"github"* ]]; then
          echo "📋 Commit author is GitHub (likely automated merge)"
          IS_PR_MERGE=true
        fi
        
        # Method 5: For squash merge, check if commit is not directly on the branch history
        # Squash merges create a new commit that's not in the feature branch history
        # We check if the parent commit is the HEAD of the target branch before the merge
        PARENT_SHA=$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || echo "")
        if [[ -n "$PARENT_SHA" ]]; then
          # Check if parent is in the branch history (if not, it might be a squash merge)
          # This is a heuristic: if the commit message doesn't match typical direct push patterns
          # and the commit structure suggests a merge, allow it
          if ! echo "$COMMIT_MSG" | grep -qE "^[a-z]+(\(.+\))?:"; then
            # Commit message doesn't follow conventional commit format (common in PR merges)
            # This is a soft indicator, so we'll be lenient
            echo "📋 Commit message format suggests PR merge (not conventional commit)"
            # Don't set IS_PR_MERGE=true here, just log it
          fi
        fi
        
        # Method 6: Most reliable - check if this commit was created via GitHub UI merge
        # GitHub adds a "Co-authored-by" or specific metadata for PR merges
        # We'll be lenient: if we can't definitively prove it's a direct push, allow it
        # This prevents false positives while still catching obvious direct pushes
        
        # If any indicator suggests PR merge, allow it
        if [[ "$IS_PR_MERGE" == "true" ]]; then
          # Additional check: detect direct merge from develop to main (without PR)
          if [[ "$BRANCH" == "main" ]]; then
            # Check if this merge is from develop branch directly (not via PR)
            # PR merges will have PR number in commit message (#123)
            # Direct merges from develop won't have PR reference
            if echo "$COMMIT_MSG" | grep -qiE "#[0-9]+"; then
              # Has PR number - this is a PR merge, allow it
              echo "✅ Push appears to be from PR merge to main - allowing"
              echo "   Commit: $GITHUB_SHA"
              echo "   Branch: $BRANCH"
              echo "   Author: $COMMIT_AUTHOR"
              exit 0
            else
              # No PR number but detected as merge - check if it's from develop
              # This could be a direct merge from develop to main (not allowed)
              if echo "$COMMIT_MSG" | grep -qiE "(develop|from develop)"; then
                echo "❌ ERROR: Direct merge from develop to main detected!"
                echo ""
                echo "🚫 Merges from develop to main must go through a Pull Request"
                echo ""
                echo "📋 Correct workflow:"
                echo "   1. Create a Pull Request from develop to main"
                echo "   2. Get PR approved"
                echo "   3. Merge PR using squash merge"
                echo ""
                echo "Current commit: $GITHUB_SHA"
                echo "Commit message: $(echo "$COMMIT_MSG" | head -1)"
                echo "Author: $COMMIT_AUTHOR"
                echo "Branch: $BRANCH"
                echo ""
                echo "💡 To fix this:"
                echo "   - Revert this merge"
                echo "   - Create a Pull Request from develop to main"
                echo "   - Merge the PR instead"
                exit 1
              fi
            fi
          fi
          
          echo "✅ Push appears to be from PR merge - allowing"
          echo "   Commit: $GITHUB_SHA"
          echo "   Branch: $BRANCH"
          echo "   Author: $COMMIT_AUTHOR"
          exit 0
        fi
        
        # If we get here, it's likely a direct push
        echo "❌ ERROR: Direct push to protected branch '$BRANCH' detected!"
        echo ""
        echo "🚫 Protected branches (main, develop) can only be updated via Pull Requests"
        echo ""
        echo "📋 Correct workflow:"
        echo "   1. Create a feature branch from develop"
        echo "   2. Make your changes"
        echo "   3. Create a Pull Request to develop (for features) or main (for hotfixes)"
        echo "   4. Get PR approved and merged"
        echo ""
        echo "Current commit: $GITHUB_SHA"
        echo "Commit message: $(echo "$COMMIT_MSG" | head -1)"
        echo "Author: $COMMIT_AUTHOR"
        echo "Branch: $BRANCH"
        echo ""
        echo "💡 To fix this:"
        echo "   - Create a new branch from your current commit"
        echo "   - Push that branch and create a PR instead"
        exit 1

  # Stage 1: Determine pipeline type and configuration
  determine-pipeline:
    runs-on: ubuntu-latest
    needs: [verify-branch-protection]
    # Skip CI for tag pushes (handled by release workflow)
    # Only proceed if branch protection check passed (or was skipped for PRs)
    if: |
      !startsWith(github.ref, 'refs/tags/') &&
      needs.verify-branch-protection.result == 'success'
    outputs:
      pipeline-type: ${{ steps.determine.outputs.type }}
      run-security: ${{ steps.determine.outputs.security }}
      run-coverage: ${{ steps.determine.outputs.coverage }}
      run-tests: ${{ steps.determine.outputs.run-tests }}
      run-build: ${{ steps.determine.outputs.run-build }}
      is-release: ${{ steps.determine.outputs.release }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Determine pipeline type
      id: determine
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        GITHUB_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        GITHUB_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        echo "🔍 Analyzing pipeline context..."
        echo "Event: $GITHUB_EVENT_NAME"
        echo "Ref: $GITHUB_REF"
        echo "Base ref: $GITHUB_BASE_REF"
        echo "Commit message: $GITHUB_HEAD_COMMIT_MESSAGE"
        
        # Determine pipeline type based on context
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          # Pull request: determine based on base branch and source branch
          BASE_BRANCH="$GITHUB_PR_BASE_REF"
          HEAD_BRANCH="$GITHUB_PR_HEAD_REF"
          
          if [[ "$BASE_BRANCH" == "main" ]]; then
            # PR to main: full pipeline (develop->main or hotfix->main)
            echo "type=pr-main" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to main (full pipeline with security and coverage)"
          elif [[ "$BASE_BRANCH" == "develop" ]]; then
            # PR to develop: lightweight pipeline (feature->develop)
            # Features should be validated but don't need full security scan yet
            echo "type=pr-develop" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to develop (lightweight: build, test, coverage - no security)"
          else
            # PR to other branch: lightweight pipeline
            echo "type=pr" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to other branch (lightweight: build and test only)"
          fi
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          # Push to main: check if it's a hotfix merge or develop merge
          COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA")
          COMMIT_AUTHOR=$(git log -1 --pretty=%an "$GITHUB_SHA")
          
          # Detect if this is a PR merge
          IS_PR_MERGE=false
          if echo "$COMMIT_MSG" | grep -qiE "(#[0-9]+|Merge pull request|Squash and merge|from [^ ]+ into)"; then
            IS_PR_MERGE=true
          elif [[ "$COMMIT_AUTHOR" == "GitHub" ]] || [[ "$COMMIT_AUTHOR" == *"github"* ]]; then
            IS_PR_MERGE=true
          fi
          
          # Detect if it's a hotfix merge
          IS_HOTFIX=false
          if echo "$COMMIT_MSG" | grep -qiE "(hotfix|hot-fix|hot_fix)"; then
            IS_HOTFIX=true
            echo "✅ Detected hotfix merge to main"
          fi
          
          # Check branch name in commit message or git history
          if [[ "$IS_HOTFIX" == "false" ]]; then
            # Check if source branch was hotfix
            SOURCE_BRANCH=$(echo "$COMMIT_MSG" | grep -oE "from [^ ]+" | sed 's/from //' || echo "")
            if echo "$SOURCE_BRANCH" | grep -qiE "^hotfix/"; then
              IS_HOTFIX=true
              echo "✅ Detected hotfix merge to main (from branch: $SOURCE_BRANCH)"
            fi
          fi
          
          if [[ "$IS_HOTFIX" == "true" ]]; then
            # Hotfix merge to main: full pipeline (build + tests + security + coverage)
            # Hotfixes need full validation since they bypass develop
            echo "type=main-hotfix" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Hotfix merge to main (full pipeline: build + tests + security + coverage + release)"
          elif [[ "$IS_PR_MERGE" == "true" ]]; then
            # Develop merge to main via PR: only build (tests already ran in PR)
            echo "type=main-develop-merge" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Develop merge to main via PR (build + security + release - tests already passed in PR)"
          else
            # Direct push to main: should not happen (only via PR)
            echo "⚠️ WARNING: Direct push to main detected (should only happen via PR)"
            echo "type=main-direct" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=false" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Direct push to main (minimal - should only happen via PR)"
          fi
        elif [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
          # Push to develop: check if it's a PR merge or direct push
          COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA")
          COMMIT_AUTHOR=$(git log -1 --pretty=%an "$GITHUB_SHA")
          
          # Detect if this is a PR merge
          IS_PR_MERGE=false
          if echo "$COMMIT_MSG" | grep -qiE "(#[0-9]+|Merge pull request|Squash and merge|from [^ ]+ into)"; then
            IS_PR_MERGE=true
            echo "✅ Detected PR merge to develop (commit message indicates PR merge)"
          elif [[ "$COMMIT_AUTHOR" == "GitHub" ]] || [[ "$COMMIT_AUTHOR" == *"github"* ]]; then
            IS_PR_MERGE=true
            echo "✅ Detected PR merge to develop (GitHub author)"
          fi
          
          if [[ "$IS_PR_MERGE" == "true" ]]; then
            # PR merge to develop: only build (tests already ran in PR)
            echo "type=develop-merge" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR merge to develop (build only - tests already passed in PR)"
          else
            # Direct push to develop: should not happen (only via PR)
            echo "⚠️ WARNING: Direct push to develop detected"
            echo "type=develop-direct" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=false" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Direct push to develop (minimal - should only happen via PR)"
          fi
        else
          # Feature branch push: lightweight pipeline
          echo "type=feature" >> $GITHUB_OUTPUT
          echo "security=false" >> $GITHUB_OUTPUT
          echo "coverage=false" >> $GITHUB_OUTPUT
          echo "run-tests=true" >> $GITHUB_OUTPUT
          echo "run-build=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Feature branch (lightweight: build and test only)"
        fi

  # Stage 1.5: Warn about direct pushes to develop (should only happen via PR)
  warn-direct-develop:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    steps:
    - name: Warn about direct push to develop
      env:
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        echo "⚠️ WARNING: Direct push to develop branch detected!"
        echo "⚠️ Develop should only be updated via Pull Requests from feature branches"
        echo "⚠️ This pipeline will run minimal checks only"
        echo "⚠️ For proper validation, create a PR from your feature branch to develop"
        echo ""
        echo "Current commit: $GITHUB_SHA"
        echo "Author: $GITHUB_ACTOR"

  # Stage 2: Setup and Dependencies (always runs)
  setup:
    runs-on: ubuntu-latest
    needs: [determine-pipeline]
    if: needs.determine-pipeline.result == 'success'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # For PRs, checkout the PR head commit
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Validate GitHub account and token access
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        echo "🔍 Validating GitHub account and token access..."
        echo ""
        echo "📋 GitHub Account Information:"
        echo "   - Repository: $GITHUB_REPOSITORY"
        echo "   - Actor: $GITHUB_ACTOR"
        echo "   - Event: $GITHUB_EVENT_NAME"
        echo ""
        
        # Check if we have a token
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ] && [ -z "$GITHUB_TOKEN" ]; then
          echo "❌ ERROR: No token available"
          echo "   Please configure SYNTEGRITY_DAGGER_TOKEN or GITHUB_TOKEN"
          exit 1
        fi
        
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise GITHUB_TOKEN
        TOKEN="${SYNTEGRITY_DAGGER_TOKEN:-$GITHUB_TOKEN}"
        TOKEN_TYPE="SYNTEGRITY_DAGGER_TOKEN"
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          TOKEN_TYPE="GITHUB_TOKEN"
          echo "⚠️ Using GITHUB_TOKEN (SYNTEGRITY_DAGGER_TOKEN not set)"
          echo "⚠️ GITHUB_TOKEN may not have access to private organization repositories"
        else
          echo "✅ Using SYNTEGRITY_DAGGER_TOKEN"
        fi
        
        # Test access to private repository
        echo ""
        echo "🔍 Testing access to private repository: github.com/getsyntegrity/go-kit-logger"
        if git ls-remote --heads "https://x-access-token:${TOKEN}@github.com/getsyntegrity/go-kit-logger.git" > /dev/null 2>&1; then
          echo "✅ Token has access to private repository"
        else
          echo "❌ Token does NOT have access to private repository"
          echo ""
          echo "📋 For FREE GitHub accounts - Setup Instructions:"
          echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
          echo "   2. Select scopes: 'repo' (full control of private repositories)"
          echo "   3. Add it as secret 'SYNTEGRITY_DAGGER_TOKEN' in:"
          echo "      Repository Settings → Secrets and variables → Actions"
          echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
          echo ""
          echo "💡 Why this is needed:"
          echo "   - GITHUB_TOKEN (default) does NOT have access to private organization repos"
          echo "   - Free accounts need a PAT with 'repo' scope for private repo access"
          echo "   - This is a GitHub limitation for free accounts"
          echo ""
          echo "⚠️ Pipeline will continue but may fail during 'go mod download'"
        fi
        
        echo ""
        echo "📊 GitHub Actions Limits (Free Accounts):"
        echo "   - Private repos: 2,000 minutes/month"
        echo "   - Public repos: Unlimited minutes"
        echo "   - Concurrent jobs: Limited"
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Disable default cache to use our custom one
        
    - name: Configure Git and Go for private repos
      env:
        SYNTEGRITY_DAGGER_TOKEN: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SYNTEGRITY_DAGGER_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SYNTEGRITY_DAGGER_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SYNTEGRITY_DAGGER_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SYNTEGRITY_DAGGER_TOKEN secret with a token that has 'repo' scope"
            echo ""
            echo "📋 For FREE GitHub accounts:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SYNTEGRITY_DAGGER_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
            export SYNTEGRITY_DAGGER_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SYNTEGRITY_DAGGER_TOKEN nor GITHUB_TOKEN is available"
            echo ""
            echo "📋 For FREE GitHub accounts - Setup Instructions:"
