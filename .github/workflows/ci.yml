name: 'CI/CD Pipeline'

# This workflow runs when:
# 1. Push to main or develop branches (includes PR merges)
# 2. Pull requests targeting main or develop (for pre-merge validation)
# 3. Branch deletion events (to prevent deletion of protected branches)
# 4. Manual trigger via workflow_dispatch
# Note: PR merges trigger push events, so we handle both to avoid duplicates
on:
  push:
    branches: [ 'main', 'develop', 'feature/shipwright-public-module-api-*' ]
  pull_request:
    branches: [ 'main', 'develop', 'feature/shipwright-public-module-api-*' ]
    types: ['opened', 'synchronize', 'reopened', 'ready_for_review']
  delete:
  workflow_dispatch:

permissions:
  contents: 'read'
  actions: 'write'  # Required to trigger workflow_dispatch
  pull-requests: 'read'  # Required by verify-branch-protection to query commit->PR association

env:
  GO_VERSION: '1.26.7'
  CACHE_VERSION: 'v1'

jobs:
  # Stage -1: Prevent deletion of protected branches
  prevent-branch-deletion:
    runs-on: 'ubuntu-latest'
    if: "github.event_name == 'delete' && github.event.ref_type == 'branch'"
    steps:
    - name: 'Prevent branch deletion'
      env:
        BRANCH: '${{ github.event.ref }}'
        REF_TYPE: '${{ github.event.ref_type }}'
        GITHUB_ACTOR: '${{ github.actor }}'
        GITHUB_EVENT_NAME: '${{ github.event_name }}'
      run: |
        # For delete events, github.event.ref_name doesn't exist
        # We must use github.event.ref and extract the branch name from it
        # SECURITY: Using env: block prevents shell injection from branch names

        # Extract branch name from ref (e.g., "refs/heads/main" -> "main")
        if [[ "$BRANCH" =~ ^refs/heads/(.+)$ ]]; then
          BRANCH_NAME="${BASH_REMATCH[1]}"
        elif [[ "$BRANCH" =~ ^refs/tags/(.+)$ ]]; then
          # This is a tag, not a branch
          BRANCH_NAME=""
        else
          # Safer fallback: strip "refs/" prefix if present, otherwise use as-is
          # This preserves branch names with slashes (e.g., "feature/main" stays as "feature/main")
          # Using ${BRANCH#refs/} instead of ${BRANCH##*/} prevents truncating branch names
          BRANCH_NAME="${BRANCH#refs/}"
        fi

        # Validate that branch name was extracted correctly
        if [[ -z "$BRANCH_NAME" ]]; then
          echo "❌ ERROR: Failed to extract branch name from ref: $BRANCH"
          echo "Cannot determine branch name - failing to prevent potential branch deletion"
          exit 1
        fi

        # Only check for branches (not tags)
        if [[ "$REF_TYPE" != "branch" ]]; then
          echo "✅ Deletion is for a tag, not a branch - allowing"
          exit 0
        fi

        # Check if it's a protected branch
        # CRITICAL: Use BRANCH_NAME (extracted from github.event.ref), not github.event.ref_name
        if [[ "$BRANCH_NAME" != "main" ]] && [[ "$BRANCH_NAME" != "develop" ]]; then
          echo "✅ Branch '$BRANCH_NAME' is not protected - deletion allowed"
          exit 0
        fi

        # If we get here, it's an attempt to delete a protected branch
        # NOTE: GitHub's delete event fires AFTER deletion occurs, so we cannot prevent it
        # This workflow serves as a detection and alert mechanism
        echo "❌ SECURITY ALERT: Protected branch deletion detected!"
        echo ""
        echo "🚨 CRITICAL: A protected branch has been deleted!"
        echo ""
        echo "⚠️  IMPORTANT: GitHub's delete event fires AFTER deletion occurs."
        echo "   This workflow cannot prevent deletions - it only detects and alerts."
        echo "   The branch '$BRANCH_NAME' has already been deleted."
        echo ""
        echo "📋 Branch information:"
        echo "   - Branch ref: $BRANCH"
        echo "   - Branch name: $BRANCH_NAME"
        echo "   - Ref type: $REF_TYPE"
        echo "   - Actor: $GITHUB_ACTOR"
        echo "   - Event: $GITHUB_EVENT_NAME"
        echo ""
        echo "🔒 Protected branches that should not be deleted:"
        echo "   - main"
        echo "   - develop"
        echo ""
        echo "🚨 IMMEDIATE ACTION REQUIRED:"
        echo "   - Contact repository administrators immediately"
        echo "   - Investigate who deleted the branch and why"
        echo "   - Restore the branch if deletion was accidental"
        echo ""
        echo "💡 To restore a deleted branch:"
        echo "   - Use git reflog to find the commit SHA"
        echo "   - Restore from a backup or previous commit"
        echo "   - Contact GitHub support if needed"
        echo ""
        echo "❌ This workflow will fail to alert maintainers of this security incident"
        exit 1

  # Stage 0: Verify no direct pushes to protected branches
  verify-branch-protection:
    runs-on: 'ubuntu-latest'
    steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: 0

    - name: 'Log heuristic signals (informational only)'
      env:
        GITHUB_EVENT_NAME: '${{ github.event_name }}'
        GITHUB_REF_NAME: '${{ github.ref_name }}'
        GITHUB_SHA: '${{ github.sha }}'
        GITHUB_EVENT_COMMITS: '${{ toJSON(github.event.commits) }}'
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        #
        # These signals (commit message, parent count, push commit count,
        # author) are printed for human debugging ONLY. None of them gate
        # this job -- a --rebase merge keeps the original author, the
        # original non-PR-referencing commit message, and a single parent,
        # so it is structurally indistinguishable from a direct push under
        # these heuristics alone (this is exactly what false-flagged PR
        # #217's legitimate rebase-merge commit 0f2a002). The actual
        # pass/fail verdict comes from the GitHub API check below.
        if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
          echo "Not a push event (event: $GITHUB_EVENT_NAME) - no heuristic signals to log"
          exit 0
        fi

        BRANCH="$GITHUB_REF_NAME"
        if [[ "$BRANCH" != "main" ]] && [[ "$BRANCH" != "develop" ]]; then
          echo "Branch '$BRANCH' is not protected - no heuristic signals to log"
          exit 0
        fi

        COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA")
        COMMIT_AUTHOR=$(git log -1 --pretty=%an "$GITHUB_SHA")
        PARENT_COUNT=$(git rev-list --count "$GITHUB_SHA^..$GITHUB_SHA" 2>/dev/null || echo "0")
        COMMIT_COUNT=$(echo "$GITHUB_EVENT_COMMITS" | jq '. | length' 2>/dev/null || echo "0")

        echo "📋 Commit: $GITHUB_SHA"
        echo "📋 Branch: $BRANCH"
        echo "📋 Author: $COMMIT_AUTHOR"
        echo "📋 Message: $(echo "$COMMIT_MSG" | head -1)"
        echo "📋 Parent count: $PARENT_COUNT"
        echo "📋 Push commit count: $COMMIT_COUNT"
        echo "ℹ️  These signals are informational only and do not affect the verdict."

    - name: 'Verify branch protection'
      env:
        GITHUB_EVENT_NAME: '${{ github.event_name }}'
        GITHUB_REF_NAME: '${{ github.ref_name }}'
        GITHUB_SHA: '${{ github.sha }}'
        GH_TOKEN: '${{ github.token }}'
        REPO: '${{ github.repository }}'
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        # Only check for direct pushes, PRs are allowed
        if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
          echo "✅ Not a direct push (event: $GITHUB_EVENT_NAME) - branch protection check skipped"
          exit 0
        fi

        BRANCH="$GITHUB_REF_NAME"

        # Skip check for non-protected branches
        if [[ "$BRANCH" != "main" ]] && [[ "$BRANCH" != "develop" ]]; then
          echo "✅ Branch '$BRANCH' is not protected - direct push allowed"
          exit 0
        fi

        # Source of truth: ask GitHub itself which merged pull request (if
        # any) introduced this commit, regardless of merge strategy (merge
        # commit, squash, or rebase all resolve correctly through this
        # endpoint). This replaces inferring "looks like a merge" from
        # commit message/parent count/author, which a --rebase merge can't
        # be reliably distinguished from a direct push under.
        PULLS_JSON="$(mktemp)"
        if ! gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls" > "$PULLS_JSON" 2>/dev/null; then
          echo "❌ ERROR: Could not query GitHub for pull requests associated with commit ${GITHUB_SHA}."
          echo "🚫 Failing closed: without API confirmation, a push to a protected branch is not allowed."
          exit 1
        fi

        chmod +x scripts/branch-protection-check.sh
        if scripts/branch-protection-check.sh "$BRANCH" "$PULLS_JSON"; then
          exit 0
        fi

        echo "❌ ERROR: Direct push to protected branch '$BRANCH' detected!"
        echo ""
        echo "🚫 Protected branches (main, develop) can only be updated via Pull Requests"
        echo ""
        echo "📋 Correct workflow:"
        echo "   1. Create a feature branch from develop"
        echo "   2. Make your changes"
        echo "   3. Create a Pull Request to develop (for features) or main (for hotfixes)"
        echo "   4. Get PR approved and merged"
        echo ""
        echo "Current commit: $GITHUB_SHA"
        echo "Branch: $BRANCH"
        echo ""
        echo "💡 To fix this:"
        echo "   - Create a new branch from your current commit"
        echo "   - Push that branch and create a PR instead"
        exit 1

  # Stage 1: Determine pipeline type and configuration
  determine-pipeline:
    runs-on: 'ubuntu-latest'
    needs: ['verify-branch-protection']
    # Skip CI for tag pushes (handled by release workflow)
    # Only proceed if branch protection check passed (or was skipped for PRs)
    if: |
      !startsWith(github.ref, 'refs/tags/') &&
      needs.verify-branch-protection.result == 'success'
    outputs:
      pipeline-type: '${{ steps.determine.outputs.type }}'
      run-security: '${{ steps.determine.outputs.security }}'
      run-coverage: '${{ steps.determine.outputs.coverage }}'
      run-tests: '${{ steps.determine.outputs.run-tests }}'
      run-build: '${{ steps.determine.outputs.run-build }}'
      is-release: '${{ steps.determine.outputs.release }}'
    steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: 0

    - name: 'Determine pipeline type'
      id: 'determine'
      env:
        GITHUB_EVENT_NAME: '${{ github.event_name }}'
        GITHUB_REF: '${{ github.ref }}'
        GITHUB_BASE_REF: '${{ github.base_ref }}'
        GITHUB_SHA: '${{ github.sha }}'
        GITHUB_HEAD_COMMIT_MESSAGE: '${{ github.event.head_commit.message }}'
        GITHUB_PR_BASE_REF: '${{ github.event.pull_request.base.ref }}'
        GITHUB_PR_HEAD_REF: '${{ github.event.pull_request.head.ref }}'
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        echo "🔍 Analyzing pipeline context..."
        echo "Event: $GITHUB_EVENT_NAME"
        echo "Ref: $GITHUB_REF"
        echo "Base ref: $GITHUB_BASE_REF"
        echo "Commit message: $GITHUB_HEAD_COMMIT_MESSAGE"

        # Determine pipeline type based on context
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          # Pull request: determine based on base branch and source branch
          BASE_BRANCH="$GITHUB_PR_BASE_REF"
          HEAD_BRANCH="$GITHUB_PR_HEAD_REF"

          if [[ "$BASE_BRANCH" == "main" ]]; then
            # PR to main: full pipeline (develop->main or hotfix->main)
            echo "type=pr-main" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to main (full pipeline with security and coverage)"
          elif [[ "$BASE_BRANCH" == "develop" ]]; then
            # PR to develop: lightweight pipeline (feature->develop)
            # Features should be validated but don't need full security scan yet
            echo "type=pr-develop" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to develop (lightweight: build, test, coverage - no security)"
          else
            # PR to other branch: lightweight pipeline
            echo "type=pr" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR to other branch (lightweight: build and test only)"
          fi
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          # Push to main: check if it's a hotfix merge or develop merge
          COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA")
          COMMIT_AUTHOR=$(git log -1 --pretty=%an "$GITHUB_SHA")

          # Detect if this is a PR merge
          IS_PR_MERGE=false
          if echo "$COMMIT_MSG" | grep -qiE "(#[0-9]+|Merge pull request|Squash and merge|from [^ ]+ into)"; then
            IS_PR_MERGE=true
          elif [[ "$COMMIT_AUTHOR" == "GitHub" ]] || [[ "$COMMIT_AUTHOR" == *"github"* ]]; then
            IS_PR_MERGE=true
          fi

          # Detect if it's a hotfix merge
          IS_HOTFIX=false
          if echo "$COMMIT_MSG" | grep -qiE "(hotfix|hot-fix|hot_fix)"; then
            IS_HOTFIX=true
            echo "✅ Detected hotfix merge to main"
          fi

          # Check branch name in commit message or git history
          if [[ "$IS_HOTFIX" == "false" ]]; then
            # Check if source branch was hotfix
            SOURCE_BRANCH=$(echo "$COMMIT_MSG" | grep -oE "from [^ ]+" | sed 's/from //' || echo "")
            if echo "$SOURCE_BRANCH" | grep -qiE "^hotfix/"; then
              IS_HOTFIX=true
              echo "✅ Detected hotfix merge to main (from branch: $SOURCE_BRANCH)"
            fi
          fi

          if [[ "$IS_HOTFIX" == "true" ]]; then
            # Hotfix merge to main: full pipeline (build + tests + security + coverage)
            # Hotfixes need full validation since they bypass develop
            echo "type=main-hotfix" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=true" >> $GITHUB_OUTPUT
            echo "run-tests=true" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Hotfix merge to main (full pipeline: build + tests + security + coverage + release)"
          elif [[ "$IS_PR_MERGE" == "true" ]]; then
            # Develop merge to main via PR: only build (tests already ran in PR)
            echo "type=main-develop-merge" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Develop merge to main via PR (build + security + release - tests already passed in PR)"
          else
            # Direct push to main: should not happen (only via PR)
            echo "⚠️ WARNING: Direct push to main detected (should only happen via PR)"
            echo "type=main-direct" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=false" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Direct push to main (minimal - should only happen via PR)"
          fi
        elif [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
          # Push to develop: check if it's a PR merge or direct push
          COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA")
          COMMIT_AUTHOR=$(git log -1 --pretty=%an "$GITHUB_SHA")

          # Detect if this is a PR merge
          IS_PR_MERGE=false
          if echo "$COMMIT_MSG" | grep -qiE "(#[0-9]+|Merge pull request|Squash and merge|from [^ ]+ into)"; then
            IS_PR_MERGE=true
            echo "✅ Detected PR merge to develop (commit message indicates PR merge)"
          elif [[ "$COMMIT_AUTHOR" == "GitHub" ]] || [[ "$COMMIT_AUTHOR" == *"github"* ]]; then
            IS_PR_MERGE=true
            echo "✅ Detected PR merge to develop (GitHub author)"
          fi

          if [[ "$IS_PR_MERGE" == "true" ]]; then
            # PR merge to develop: only build (tests already ran in PR)
            echo "type=develop-merge" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=true" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: PR merge to develop (build only - tests already passed in PR)"
          else
            # Direct push to develop: should not happen (only via PR)
            echo "⚠️ WARNING: Direct push to develop detected"
            echo "type=develop-direct" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
            echo "coverage=false" >> $GITHUB_OUTPUT
            echo "run-tests=false" >> $GITHUB_OUTPUT
            echo "run-build=false" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "📋 Pipeline: Direct push to develop (minimal - should only happen via PR)"
          fi
        else
          # Feature branch push: lightweight pipeline
          echo "type=feature" >> $GITHUB_OUTPUT
          echo "security=false" >> $GITHUB_OUTPUT
          echo "coverage=false" >> $GITHUB_OUTPUT
          echo "run-tests=true" >> $GITHUB_OUTPUT
          echo "run-build=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Feature branch (lightweight: build and test only)"
        fi

  # Stage 1.5: Warn about direct pushes to develop (should only happen via PR)
  warn-direct-develop:
    runs-on: 'ubuntu-latest'
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    steps:
    - name: 'Warn about direct push to develop'
      env:
        GITHUB_SHA: '${{ github.sha }}'
        GITHUB_ACTOR: '${{ github.actor }}'
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        echo "⚠️ WARNING: Direct push to develop branch detected!"
        echo "⚠️ Develop should only be updated via Pull Requests from feature branches"
        echo "⚠️ This pipeline will run minimal checks only"
        echo "⚠️ For proper validation, create a PR from your feature branch to develop"
        echo ""
        echo "Current commit: $GITHUB_SHA"
        echo "Author: $GITHUB_ACTOR"

  # Stage 2: Setup and Dependencies (always runs)
  setup:
    runs-on: 'ubuntu-latest'
    needs: ['determine-pipeline']
    if: "needs.determine-pipeline.result == 'success'"
    steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        # For PRs, checkout the PR head commit
        ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

    - name: 'Validate GitHub account and token access'
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        GITHUB_REPOSITORY: '${{ github.repository }}'
        GITHUB_ACTOR: '${{ github.actor }}'
        GITHUB_EVENT_NAME: '${{ github.event_name }}'
      run: |
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        echo "🔍 Validating GitHub account and token access..."
        echo ""
        echo "📋 GitHub Account Information:"
        echo "   - Repository: $GITHUB_REPOSITORY"
        echo "   - Actor: $GITHUB_ACTOR"
        echo "   - Event: $GITHUB_EVENT_NAME"
        echo ""

        # Check if we have a token
        if [ -z "$SHIPWRIGHT_TOKEN" ] && [ -z "$GITHUB_TOKEN" ]; then
          echo "❌ ERROR: No token available"
          echo "   Please configure SHIPWRIGHT_TOKEN or GITHUB_TOKEN"
          exit 1
        fi

        # Use SHIPWRIGHT_TOKEN if available, otherwise GITHUB_TOKEN
        TOKEN="${SHIPWRIGHT_TOKEN:-$GITHUB_TOKEN}"
        TOKEN_TYPE="SHIPWRIGHT_TOKEN"
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          TOKEN_TYPE="GITHUB_TOKEN"
          echo "⚠️ Using GITHUB_TOKEN (SHIPWRIGHT_TOKEN not set)"
          echo "⚠️ GITHUB_TOKEN may not have access to private organization repositories"
        else
          echo "✅ Using SHIPWRIGHT_TOKEN"
        fi

        # Test access to private repository
        echo ""
        echo "🔍 Testing access to private repository: github.com/getsyntegrity/go-kit-logger"
        if git ls-remote --heads "https://x-access-token:${TOKEN}@github.com/getsyntegrity/go-kit-logger.git" > /dev/null 2>&1; then
          echo "✅ Token has access to private repository"
        else
          echo "❌ Token does NOT have access to private repository"
          echo ""
          echo "📋 For FREE GitHub accounts - Setup Instructions:"
          echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
          echo "   2. Select scopes: 'repo' (full control of private repositories)"
          echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
          echo "      Repository Settings → Secrets and variables → Actions"
          echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
          echo ""
          echo "💡 Why this is needed:"
          echo "   - GITHUB_TOKEN (default) does NOT have access to private organization repos"
          echo "   - Free accounts need a PAT with 'repo' scope for private repo access"
          echo "   - This is a GitHub limitation for free accounts"
          echo ""
          echo "⚠️ Pipeline will continue but may fail during 'go mod download'"
        fi

        echo ""
        echo "📊 GitHub Actions Limits (Free Accounts):"
        echo "   - Private repos: 2,000 minutes/month"
        echo "   - Public repos: Unlimited minutes"
        echo "   - Concurrent jobs: Limited"

    - name: 'Set up Go'
      uses: 'actions/setup-go@v7'
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache: false  # Disable default cache to use our custom one

    - name: 'Configure Git and Go for private repos'
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SHIPWRIGHT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SHIPWRIGHT_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SHIPWRIGHT_TOKEN secret with a token that has 'repo' scope"
            echo ""
            echo "📋 For FREE GitHub accounts:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
            export SHIPWRIGHT_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SHIPWRIGHT_TOKEN nor GITHUB_TOKEN is available"
            echo ""
            echo "📋 For FREE GitHub accounts - Setup Instructions:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
            echo ""
            echo "💡 Why this is needed:"
            echo "   - GITHUB_TOKEN (default) does NOT have access to private organization repos"
            echo "   - Free accounts need a PAT with 'repo' scope for private repo access"
            exit 1
          fi
        fi

        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*

        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SHIPWRIGHT_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc

        # Configure Git authentication with token (escape special characters)
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Verify authentication setup
        echo "✅ Git and Go configured for private repos"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "Git URL config:"
        git config --global --get-regexp url || echo "No URL config found"

    - name: 'Cache Go modules'
      uses: 'actions/cache@v6'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: "go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}"
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false

    - name: 'Download dependencies'
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "📦 Downloading Go dependencies..."

        # Use SHIPWRIGHT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SHIPWRIGHT_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SHIPWRIGHT_TOKEN secret with a token that has 'repo' scope"
            echo ""
            echo "📋 For FREE GitHub accounts:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
            export SHIPWRIGHT_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SHIPWRIGHT_TOKEN nor GITHUB_TOKEN is available"
            echo ""
            echo "📋 For FREE GitHub accounts - Setup Instructions:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
            echo ""
            echo "💡 Why this is needed:"
            echo "   - GITHUB_TOKEN (default) does NOT have access to private organization repos"
            echo "   - Free accounts need a PAT with 'repo' scope for private repo access"
            exit 1
          fi
        fi

        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SHIPWRIGHT_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc

        # Test authentication before downloading
        echo "Testing GitHub authentication..."
        if git ls-remote --heads "https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" > /dev/null 2>&1; then
          echo "✅ Authentication test successful"
        else
          echo "⚠️ Authentication test failed - token may not have access to private repository"
          echo "⚠️ This will likely cause 'go mod download' to fail"
          echo "⚠️ Consider configuring SHIPWRIGHT_TOKEN with a token that has 'repo' scope"
        fi

        # Download dependencies with error handling
        if ! go mod download; then
          echo "❌ Failed to download dependencies"
          echo ""
          echo "🔍 Debugging information:"
          echo "GOPRIVATE: $(go env GOPRIVATE)"
          echo "Git URL config:"
          git config --global --get-regexp url || echo "No URL config found"
          echo ""
          echo "Testing GitHub access with token..."
          if git ls-remote --heads "https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" > /dev/null 2>&1; then
            echo "✅ Token has access to repository"
          else
            echo "❌ Token does not have access to repository"
            echo ""
            echo "💡 Solution for FREE GitHub accounts:"
            echo "1. Create a Personal Access Token (PAT) with 'repo' scope at:"
            echo "   https://github.com/settings/tokens"
            echo "2. Select scopes: 'repo' (full control of private repositories)"
            echo "3. Add it as a secret named 'SHIPWRIGHT_TOKEN' in:"
            echo "   Repository Settings → Secrets and variables → Actions"
            echo "4. The token must have access to the private repository:"
            echo "   github.com/getsyntegrity/go-kit-logger"
            echo ""
            echo "⚠️ GITHUB_TOKEN (default) does not have access to private organization repositories"
            echo "⚠️ Free accounts require a PAT with 'repo' scope for private repo access"
          fi
          exit 1
        fi
        echo "✅ Dependencies downloaded"

    - name: 'Verify dependencies'
      run: |
        echo "🔍 Verifying dependencies..."
        go mod verify
        echo "✅ Dependencies verified"

  # Stage 3: Build (runs in parallel with tests and lint)
  build:
    runs-on: 'ubuntu-latest'
    needs: ['determine-pipeline', 'setup']
    if: "needs.determine-pipeline.outputs.run-build == 'true'"
    steps:
    - name: 'Setup CI environment'
      uses: './.github/actions/setup-ci'
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache-version: '${{ env.CACHE_VERSION }}'
        shipwright-token: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        github-token: '${{ secrets.GITHUB_TOKEN }}'

    - name: 'Build'
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "🔨 Building application..."

        # Use SHIPWRIGHT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SHIPWRIGHT_TOKEN not set, using GITHUB_TOKEN as fallback"
            export SHIPWRIGHT_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SHIPWRIGHT_TOKEN nor GITHUB_TOKEN is available"
            exit 1
          fi
        fi

        # Clean VCS cache to remove any cached unauthenticated URLs
        echo "🧹 Cleaning Go VCS cache..."
        rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true

        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SHIPWRIGHT_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc

        # Verify Go environment
        echo "📋 Go environment:"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "GONOPROXY: $(go env GONOPROXY)"
        echo "GONOSUMDB: $(go env GONOSUMDB)"

        # Verify authentication before building (non-blocking)
        echo "🔍 Testing authentication..."
        echo "Testing access to private repository..."
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          echo "⚠️ Warning: SHIPWRIGHT_TOKEN is empty"
        else
          echo "Token is set (length: ${#SHIPWRIGHT_TOKEN} characters)"
          # Use || true to ensure this never fails the script
          AUTH_TEST=$(git ls-remote --heads "https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" 2>&1) || true
          AUTH_EXIT_CODE=$?

          if [ $AUTH_EXIT_CODE -eq 0 ]; then
            echo "✅ Authentication verified via git ls-remote"
          else
            echo "⚠️ Warning: git ls-remote test failed (exit code: $AUTH_EXIT_CODE)"
            echo "Error output: $AUTH_TEST"
            echo ""
            echo "📋 This is a warning, not an error. Go may still be able to download modules using:"
            echo "   - .netrc file authentication"
            echo "   - Git URL rewrite configuration"
            echo "   - Go's built-in authentication mechanisms"
            echo ""
            echo "Continuing with build - go build will test actual module access..."
          fi
        fi

        go build ./...

        # providers/go and providers/rust are separate modules in go.work;
        # `./...` never crosses that module boundary (only `all` or
        # fully-qualified import paths do, and `all` would also pull in the
        # whole dependency graph), so build each explicitly to actually
        # cover it in CI.
        if [ -d "providers/go" ]; then
          (cd providers/go && go build ./...)
        else
          echo "⏭️  providers/go not found — skipping sub-module build"
        fi

        if [ -d "providers/rust" ]; then
          (cd providers/rust && go build ./...)
        else
          echo "⏭️  providers/rust not found — skipping sub-module build"
        fi

  # Stage 4: Tests (runs in parallel with build)
  test:
    runs-on: 'ubuntu-latest'
    needs: ['determine-pipeline', 'setup']
    if: "needs.determine-pipeline.outputs.run-tests == 'true'"
    steps:
    - name: 'Setup CI environment'
      uses: './.github/actions/setup-ci'
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache-version: '${{ env.CACHE_VERSION }}'
        shipwright-token: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        github-token: '${{ secrets.GITHUB_TOKEN }}'

    - name: 'Run tests'
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "🧪 Running tests..."

        # Use SHIPWRIGHT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SHIPWRIGHT_TOKEN not set, using GITHUB_TOKEN as fallback"
            export SHIPWRIGHT_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SHIPWRIGHT_TOKEN nor GITHUB_TOKEN is available"
            exit 1
          fi
        fi

        # Clean VCS cache to remove any cached unauthenticated URLs
        echo "🧹 Cleaning Go VCS cache..."
        rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true

        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SHIPWRIGHT_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc

        # Verify authentication before running tests (non-blocking)
        echo "🔍 Testing authentication..."
        echo "Testing access to private repository..."
        # Use || true to ensure this never fails the script
        AUTH_TEST=$(git ls-remote --heads "https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" 2>&1) || true
        AUTH_EXIT_CODE=$?

        if [ $AUTH_EXIT_CODE -eq 0 ]; then
          echo "✅ Authentication verified"
        else
          echo "⚠️ Warning: Authentication test failed (exit code: $AUTH_EXIT_CODE)"
          echo "Error output: $AUTH_TEST"
          echo ""
          echo "⚠️ Continuing with tests anyway - authentication may work for go mod download"
        fi

        # Exclude examples and mocks directories from test coverage
        TEST_PACKAGES=$(go list ./... | grep -v "/examples" | grep -v "/mocks")
        if [[ "${{ needs.determine-pipeline.outputs.run-coverage }}" == "true" ]]; then
          echo "📋 Running full test suite with coverage"
          go test -race -coverprofile=coverage.out $TEST_PACKAGES
        else
          echo "📋 Running basic tests (no coverage)"
          go test -race $TEST_PACKAGES
        fi

        # providers/go and providers/rust are separate modules in go.work;
        # `./...` and `go list ./...` above never traverse into them. Run
        # their tests explicitly so CI actually exercises them. Deliberately
        # excluded from coverage.out: each is an independently-published
        # module (design.md D2/D4) whose coverage is not part of root's
        # calibrated threshold.
        if [ -d "providers/go" ]; then
          echo "📋 Running providers/go module tests"
          (cd providers/go && go test -race ./...)
        else
          echo "⏭️  providers/go not found — skipping sub-module tests"
        fi

        if [ -d "providers/rust" ]; then
          echo "📋 Running providers/rust module tests"
          (cd providers/rust && go test -race ./...)
        else
          echo "⏭️  providers/rust not found — skipping sub-module tests"
        fi

    - name: 'Test tag-provider-release action'
      run: './.github/actions/tag-provider-release/test.sh'

  # Stage 5: Security (only for main/develop/PRs)
  security:
    runs-on: 'ubuntu-latest'
    needs: ['determine-pipeline', 'build']
    if: "needs.determine-pipeline.outputs.run-security == 'true'"
    steps:
    - name: 'Setup CI environment'
      uses: './.github/actions/setup-ci'
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache-version: '${{ env.CACHE_VERSION }}'
        shipwright-token: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        github-token: '${{ secrets.GITHUB_TOKEN }}'

    - name: 'Check for vulnerabilities'
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        GIT_TERMINAL_PROMPT: 0
      run: |
        echo "🔒 Running security scan..."

        # Use SHIPWRIGHT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SHIPWRIGHT_TOKEN not set, using GITHUB_TOKEN as fallback"
            export SHIPWRIGHT_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SHIPWRIGHT_TOKEN nor GITHUB_TOKEN is available"
            exit 1
          fi
        fi

        # Clean VCS cache to remove any cached unauthenticated URLs
        echo "🧹 Cleaning Go VCS cache..."
        rm -rf ~/go/pkg/mod/cache/vcs/* 2>/dev/null || true

        # Re-ensure authentication is configured (in case cache restore cleared it)
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Re-create .netrc in case it was cleared
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SHIPWRIGHT_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc

        # Verify authentication before installing tools (non-blocking)
        echo "🔍 Testing authentication..."
        echo "Testing access to private repository..."
        # Use || true to ensure this never fails the script
        AUTH_TEST=$(git ls-remote --heads "https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/getsyntegrity/go-kit-logger.git" 2>&1) || true
        AUTH_EXIT_CODE=$?

        if [ $AUTH_EXIT_CODE -eq 0 ]; then
          echo "✅ Authentication verified"
        else
          echo "⚠️ Warning: Authentication test failed (exit code: $AUTH_EXIT_CODE)"
          echo "Error output: $AUTH_TEST"
          echo ""
          echo "⚠️ Continuing with security scan anyway - authentication may work for go mod download"
        fi

        echo "📋 Go version: $(go version)"
        go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

        # Run vulnerability check and capture output
        govulncheck ./... > vuln_report.txt 2>&1 || true

        # providers/go and providers/rust are separate modules in go.work;
        # govulncheck does not span go.work module boundaries (verified:
        # findings from root and providers/go are disjoint), so scan each
        # explicitly and append to the same report the checks below already
        # parse.
        if [ -d "providers/go" ]; then
          echo "" >> vuln_report.txt
          echo "===== providers/go module =====" >> vuln_report.txt
          (cd providers/go && govulncheck ./...) >> vuln_report.txt 2>&1 || true
        else
          echo "⏭️  providers/go not found — skipping sub-module vulnerability scan"
        fi

        if [ -d "providers/rust" ]; then
          echo "" >> vuln_report.txt
          echo "===== providers/rust module =====" >> vuln_report.txt
          (cd providers/rust && govulncheck ./...) >> vuln_report.txt 2>&1 || true
        else
          echo "⏭️  providers/rust not found — skipping sub-module vulnerability scan"
        fi

        # Check if there are vulnerabilities in dependencies (not stdlib)
        if grep -q "Your code is affected" vuln_report.txt; then
          # Check if vulnerabilities are only in stdlib
          if grep -q "Standard library" vuln_report.txt && ! grep -q "packages you import" vuln_report.txt; then
            echo "⚠️ Vulnerabilities found in Go standard library"
            echo "📋 These should be fixed by updating Go version"
            echo "📋 Current Go version: $(go version)"
            cat vuln_report.txt
            echo ""
            echo "❌ Security scan failed: Go standard library vulnerabilities detected."
            echo "💡 Solution: Update Go to the latest patch version (1.25.3 or newer)"
            exit 1
          else
            echo "❌ Security vulnerabilities detected in dependencies!"
            cat vuln_report.txt
            exit 1
          fi
        elif grep -q "No vulnerabilities found" vuln_report.txt; then
          echo "✅ No security vulnerabilities found."
        else
          # Show report for debugging
          cat vuln_report.txt
          echo "✅ Security scan completed."
        fi

  # Stage 6: Tag providers/go and providers/rust for the same develop->main
  # or hotfix->main merges that trigger the root release below -- but only
  # for a provider whose own path actually changed since its last tag
  # (.github/actions/tag-provider-release). Pushing the tag is the whole
  # job: release-provider-go.yml/release-provider-rust.yml already react to
  # any pushed tag in their namespace (design.md D6), so they need no
  # changes to pick up a CI-pushed tag exactly as if a human had pushed it.
  tag-providers:
    runs-on: 'ubuntu-latest'
    needs: ['determine-pipeline', 'security']
    permissions:
      contents: 'write'
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.determine-pipeline.outputs.is-release == 'true' &&
      (needs.determine-pipeline.outputs.pipeline-type == 'main-hotfix' ||
       needs.determine-pipeline.outputs.pipeline-type == 'main-develop-merge')
    strategy:
      fail-fast: false
      matrix:
        provider: ['go', 'rust']
    steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: 'Detect source branch'
      id: 'detect-source'
      run: |
        # Same detection as the trigger-release job below.
        SOURCE_BRANCH=""
        MERGE_COMMIT=$(git log -1 --pretty=%B)
        if echo "$MERGE_COMMIT" | grep -qE "Merge pull request|Merge branch"; then
          SOURCE_BRANCH=$(echo "$MERGE_COMMIT" | grep -oE "from [^ ]+" | sed 's/from //' || echo "")
        fi
        if [[ -z "$SOURCE_BRANCH" ]]; then
          SOURCE_BRANCH=$(git log --oneline -10 | grep -iE "hotfix|develop" | head -1 | grep -oE "(hotfix|develop)[^ ]*" | head -1 || echo "")
        fi
        echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"

    - name: 'Configure Git'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: 'Tag providers/${{ matrix.provider }} if changed'
      uses: './.github/actions/tag-provider-release'
      with:
        provider-path: 'providers/${{ matrix.provider }}'
        tag-prefix: 'providers/${{ matrix.provider }}/v'
        source-branch: '${{ steps.detect-source.outputs.source_branch }}'

  # Stage 7: Trigger release workflow for develop->main or hotfix->main merges
  # IMPORTANT: Only triggers on main branch after merge, never on PRs, develop, or feature branches
  trigger-release:
    runs-on: 'ubuntu-latest'
    # Depends on final-sha-gate (not just security) so the dispatch to
    # release.yml can never race ahead of the gate finishing: release.yml's
    # create-release job independently re-verifies final-sha-gate == success
    # for this exact SHA, and that check used to fail with "found: none"
    # because trigger-release fired as soon as `security` passed, while
    # final-sha-gate (which waits on the longer-running final-sha-validation
    # and final-sha-dagger-integration jobs) was still in progress.
    needs: ['determine-pipeline', 'security', 'final-sha-gate']
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.determine-pipeline.result == 'success' &&
      needs.determine-pipeline.outputs.is-release == 'true' &&
      (needs.determine-pipeline.outputs.pipeline-type == 'main-hotfix' ||
       needs.determine-pipeline.outputs.pipeline-type == 'main-develop-merge') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      needs.final-sha-gate.result == 'success'
    steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: 0

    - name: 'Detect source branch'
      id: 'detect-source'
      run: |
        echo "🔍 Detecting source branch for release trigger..."
        echo "Pipeline type: ${{ needs.determine-pipeline.outputs.pipeline-type }}"
        echo "Is release: ${{ needs.determine-pipeline.outputs.is-release }}"
        
        # If determine-pipeline already detected this as a release-worthy merge, trust it
        PIPELINE_TYPE="${{ needs.determine-pipeline.outputs.pipeline-type }}"
        if [[ "$PIPELINE_TYPE" == "main-develop-merge" ]] || [[ "$PIPELINE_TYPE" == "main-hotfix" ]]; then
          echo "✅ Pipeline type indicates release should be triggered: $PIPELINE_TYPE"
          echo "should_trigger=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Fallback: Detect source branch from merge commit message
        SOURCE_BRANCH=""
        MERGE_COMMIT=$(git log -1 --pretty=%B)
        echo "Merge commit message: $MERGE_COMMIT"
        
        if echo "$MERGE_COMMIT" | grep -qE "Merge pull request|Merge branch"; then
          SOURCE_BRANCH=$(echo "$MERGE_COMMIT" | grep -oE "from [^ ]+" | sed 's/from //' || echo "")
          echo "Detected source branch from merge message: $SOURCE_BRANCH"
        fi
        if [[ -z "$SOURCE_BRANCH" ]]; then
          SOURCE_BRANCH=$(git log --oneline -10 | grep -iE "hotfix|develop" | head -1 | grep -oE "(hotfix|develop)[^ ]*" | head -1 || echo "")
          echo "Detected source branch from commit history: $SOURCE_BRANCH"
        fi

        # Trigger release for merges from develop or hotfix branches
        if [[ "$SOURCE_BRANCH" == "develop" ]] || echo "$SOURCE_BRANCH" | grep -qiE "^develop"; then
          echo "✅ Merge from develop detected: $SOURCE_BRANCH"
          echo "should_trigger=true" >> $GITHUB_OUTPUT
        elif echo "$SOURCE_BRANCH" | grep -qiE "^hotfix/"; then
          echo "✅ Merge from hotfix detected: $SOURCE_BRANCH"
          echo "should_trigger=true" >> $GITHUB_OUTPUT
        else
          echo "⏭️ Merge is not from develop or hotfix (detected: $SOURCE_BRANCH) - skipping release trigger"
          echo "should_trigger=false" >> $GITHUB_OUTPUT
        fi

    - name: 'Trigger release workflow'
      if: "steps.detect-source.outputs.should_trigger == 'true'"
      uses: 'actions/github-script@v9'
      # Uses the workflow's own GITHUB_TOKEN (permissions.actions: write,
      # line 20) instead of a PAT secret -- workflow_dispatch dispatched
      # explicitly via the API is not subject to the "GITHUB_TOKEN events
      # don't trigger other workflows" recursion guard (that guard only
      # covers implicit side-effect events like push/PR), so no PAT is
      # needed here, and it can't silently go stale like one can.
      with:
        script: |
          // Trigger release workflow with workflow_dispatch to use latest main version
          const currentSha = context.sha;
          console.log(`🚀 Triggering release workflow for commit ${currentSha} (develop->main merge)`);

          try {
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main', // Always use main branch to get latest workflow version
              inputs: {
                commit_sha: currentSha // Pass the CI commit SHA for checkout
              }
            });
            console.log(`✅ Release workflow triggered successfully`);
            console.log(`📋 Response status: ${response.status || 'N/A'}`);
          } catch (error) {
            // If workflow is already running, GitHub will return an error
            // This is acceptable - the release will still proceed
            console.error(`❌ Error details:`, {
              status: error.status,
              message: error.message,
              response: error.response?.data
            });
            
            if (error.status === 422 || error.message.includes('already running')) {
              console.log(`ℹ️ Release workflow may already be running for this commit`);
              console.log(`   This is normal - the release will proceed`);
            } else if (error.status === 404) {
              console.error(`❌ Workflow 'release.yml' not found. Please verify the workflow file exists.`);
              throw error;
            } else if (error.status === 403) {
              console.error(`❌ Permission denied. Token may not have 'actions: write' permission.`);
              console.error(`   Please verify the token has the correct permissions.`);
              throw error;
            } else {
              console.error(`❌ Error triggering release workflow: ${error.message}`);
              throw error;
            }
          }

  # Closes the gap tracked in #191: final-sha-gate (#185, #187-#190) only
  # runs on `push` to develop/main, so it can never itself be a required
  # status check on a pull_request — GitHub never asks a push-only job to
  # report on a PR's head SHA. Meanwhile verify-pipeline-success is the
  # only check actually required by branch protection on develop and main,
  # and it runs on `pull_request` only, so it never sees final-sha-gate's
  # verdict either. A develop->main promotion PR could therefore merge
  # even when the develop HEAD it promotes never passed (or never ran)
  # `make ci-final`.
  #
  # For a develop->main promotion PR specifically, this job looks up the
  # check-runs already recorded against the PR's head SHA (the develop
  # HEAD being promoted) and requires a 'final-sha-gate' check-run with
  # conclusion 'success'. verify-pipeline-success folds this job's result
  # into its own gate below, so the existing required status check
  # enforces it without any branch-protection reconfiguration.
  verify-final-sha-promotion:
    runs-on: 'ubuntu-latest'
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    permissions:
      contents: 'read'
      checks: 'read'
    steps:
    - name: 'Verify final-sha-gate verdict for develop HEAD'
      uses: 'actions/github-script@v9'
      with:
        github-token: '${{ secrets.GITHUB_TOKEN }}'
        script: |
          const sha = context.payload.pull_request.head.sha;
          const { data } = await github.rest.checks.listForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: sha,
          });
          // A push to develop and this PR's own synchronize event both create
          // a same-named 'final-sha-gate' check-run for this SHA (this job
          // always skips on pull_request). Match on conclusion==='success',
          // not just name, or an unrelated skipped run can shadow the real one.
          const gate = data.check_runs.find((run) => run.name === 'final-sha-gate' && run.conclusion === 'success');
          if (!gate) {
            core.setFailed(
              `No 'final-sha-gate' check-run found for develop HEAD ${sha}. ` +
              `This SHA was never validated by 'make ci-final' via a push to develop - promotion cannot proceed.`
            );
            return;
          }
          if (gate.conclusion !== 'success') {
            core.setFailed(
              `'final-sha-gate' for develop HEAD ${sha} concluded '${gate.conclusion}', not 'success'. ` +
              `This SHA is not Final-SHA valid - promotion cannot proceed.`
            );
            return;
          }
          console.log(`✅ final-sha-gate verdict for ${sha}: success`);

  # Final stage: Verify all critical jobs passed (blocks merge if any failed)
  verify-pipeline-success:
    runs-on: 'ubuntu-latest'
    needs: ['determine-pipeline', 'setup', 'build', 'test', 'security', 'verify-final-sha-promotion']
    if: |
      always() &&
      github.event_name == 'pull_request'
    steps:
    - name: 'Verify all critical jobs passed'
      env:
        # SECURITY: Using env: block prevents shell injection from GitHub context variables
        PR_BASE_REF: '${{ github.event.pull_request.base.ref }}'
        PR_HEAD_REF: '${{ github.event.pull_request.head.ref }}'
      run: |
        echo "🔍 Verifying all critical pipeline jobs completed successfully..."
        echo ""

        FAILED_JOBS=""

        # Check each critical job
        if [[ "${{ needs.determine-pipeline.result }}" != "success" ]]; then
          FAILED_JOBS="${FAILED_JOBS}determine-pipeline "
        fi

        if [[ "${{ needs.setup.result }}" != "success" ]]; then
          FAILED_JOBS="${FAILED_JOBS}setup "
        fi

        # Build is conditional - only check if it was supposed to run
        if [[ "${{ needs.determine-pipeline.outputs.run-build }}" == "true" ]]; then
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            FAILED_JOBS="${FAILED_JOBS}build "
          fi
        fi

        # Test is conditional - only check if it was supposed to run
        if [[ "${{ needs.determine-pipeline.outputs.run-tests }}" == "true" ]]; then
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            FAILED_JOBS="${FAILED_JOBS}test "
          fi
        fi

        # Security is conditional - only check if it was supposed to run
        if [[ "${{ needs.determine-pipeline.outputs.run-security }}" == "true" ]]; then
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            FAILED_JOBS="${FAILED_JOBS}security "
          fi
        fi

        # Final-SHA promotion gate is conditional - only applies to develop->main promotion PRs
        IS_DEVELOP_PROMOTION="false"
        if [[ "$PR_BASE_REF" == "main" && "$PR_HEAD_REF" == "develop" ]]; then
          IS_DEVELOP_PROMOTION="true"
          if [[ "${{ needs.verify-final-sha-promotion.result }}" != "success" ]]; then
            FAILED_JOBS="${FAILED_JOBS}verify-final-sha-promotion "
          fi
        fi

        if [[ -n "$FAILED_JOBS" ]]; then
          echo "❌ ERROR: The following critical jobs failed:"
          echo "   $FAILED_JOBS"
          echo ""
          echo "🚫 This Pull Request cannot be merged until all jobs pass"
          echo ""
          echo "📋 Job results:"
          echo "   - determine-pipeline: ${{ needs.determine-pipeline.result }}"
          echo "   - setup: ${{ needs.setup.result }}"
          if [[ "${{ needs.determine-pipeline.outputs.run-build }}" == "true" ]]; then
            echo "   - build: ${{ needs.build.result }}"
          else
            echo "   - build: skipped (not required for this pipeline type)"
          fi
          if [[ "${{ needs.determine-pipeline.outputs.run-tests }}" == "true" ]]; then
            echo "   - test: ${{ needs.test.result }}"
          else
            echo "   - test: skipped (not required for this pipeline type)"
          fi
          if [[ "${{ needs.determine-pipeline.outputs.run-security }}" == "true" ]]; then
            echo "   - security: ${{ needs.security.result }}"
          else
            echo "   - security: skipped (not required for this pipeline type)"
          fi
          if [[ "$IS_DEVELOP_PROMOTION" == "true" ]]; then
            echo "   - verify-final-sha-promotion: ${{ needs.verify-final-sha-promotion.result }}"
          else
            echo "   - verify-final-sha-promotion: skipped (not a develop->main promotion PR)"
          fi
          echo ""
          echo "💡 Please fix the failing jobs and push new commits to retry"
          exit 1
        else
          echo "✅ All critical jobs passed successfully"
          echo ""
          echo "📋 Job results:"
          echo "   - determine-pipeline: ✅ ${{ needs.determine-pipeline.result }}"
          echo "   - setup: ✅ ${{ needs.setup.result }}"
          if [[ "${{ needs.determine-pipeline.outputs.run-build }}" == "true" ]]; then
            echo "   - build: ✅ ${{ needs.build.result }}"
          else
            echo "   - build: ⏭️  skipped (not required for this pipeline type)"
          fi
          if [[ "${{ needs.determine-pipeline.outputs.run-tests }}" == "true" ]]; then
            echo "   - test: ✅ ${{ needs.test.result }}"
          else
            echo "   - test: ⏭️  skipped (not required for this pipeline type)"
          fi
          if [[ "${{ needs.determine-pipeline.outputs.run-security }}" == "true" ]]; then
            echo "   - security: ✅ ${{ needs.security.result }}"
          else
            echo "   - security: ⏭️  skipped (not required for this pipeline type)"
          fi
          if [[ "$IS_DEVELOP_PROMOTION" == "true" ]]; then
            echo "   - verify-final-sha-promotion: ✅ ${{ needs.verify-final-sha-promotion.result }}"
          else
            echo "   - verify-final-sha-promotion: ⏭️  skipped (not a develop->main promotion PR)"
          fi
          echo ""
          echo "✅ This Pull Request is ready to be merged"
        fi

  # PROD-001: Final-SHA validation.
  #
  # Every job above this point decides whether to run tests/coverage/security
  # on a push to develop/main based on the IS_PR_MERGE heuristics in
  # `determine-pipeline` (commit message wording, commit author) — see e.g.
  # lines ~406-414 for develop, ~371-379 for main. Those heuristics are
  # falsifiable by construction (a squash-merge commit message that doesn't
  # match the regex, a bot author, a rebase-merge) and, even when correct,
  # they assume "this SHA already passed validation as a PR head" — which is
  # not the same SHA once GitHub creates a merge/squash commit, and is never
  # true at all for a direct push. So the exact SHA that lands on the
  # integration branch may never actually be validated end-to-end.
  #
  # This job closes that gap independently of any merge-detection heuristic:
  # it runs on every push to develop or main, checks out that exact SHA, and
  # runs the single repository-owned validation contract (`make ci-final`)
  # against it — never reusing a prior PR run's result. `make ci-final` is
  # the source of truth for "is this SHA valid"; this job is only the GitHub
  # Actions adapter that invokes it. The same command run locally via
  # `git checkout <sha> && make ci-final` must produce the same PASS/FAIL,
  # and running it under a different CI provider requires only rewriting
  # this adapter, not reimplementing the guards.
  #
  # Scoped to develop and main only (not the feature/shipwright-public-*
  # push trigger above) because those are this repository's integration
  # branches; feature branches keep their existing lightweight pipeline.
  #
  # No concurrency group is defined here deliberately: each push triggers an
  # independent workflow run that checks out its own exact SHA into its own
  # isolated runner, so two SHAs landing on develop in quick succession are
  # already correctly isolated — there is no shared mutable state for a
  # concurrency group to protect.
  final-sha-validation:
    runs-on: 'ubuntu-latest'
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
    - name: 'Checkout exact Final SHA'
      uses: 'actions/checkout@v7'
      with:
        ref: '${{ github.sha }}'

    - name: 'Verify checked-out SHA matches the pushed SHA'
      run: |
        EXPECTED="${{ github.sha }}"
        ACTUAL="$(git rev-parse HEAD)"
        echo "Expected (github.sha): $EXPECTED"
        echo "Checked out (git rev-parse HEAD): $ACTUAL"
        if [[ "$EXPECTED" != "$ACTUAL" ]]; then
          echo "❌ Checkout integrity failure: checked-out SHA does not match the pushed SHA"
          exit 1
        fi
        echo "✅ Checked-out SHA matches the pushed SHA"

    - name: 'Set up Go'
      uses: 'actions/setup-go@v7'
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache: false  # Disable default cache to use our custom one

    - name: 'Cache Go modules'
      uses: 'actions/cache@v6'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: "go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}"
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false

    - name: 'Install golangci-lint'
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

    - name: 'Install govulncheck'
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

    - name: 'Run repository-owned Final-SHA validation contract'
      run: |
        echo "🔐 Running 'make ci-final' against $(git rev-parse HEAD)"
        make ci-final

  # Real-engine acceptance counterpart to final-sha-validation above. Runs
  # independently (not `needs: final-sha-validation`) on the same exact SHA,
  # so both contracts are exercised in parallel and final-sha-gate composes
  # their verdicts. Deliberately NOT folded into `make ci-final` -- see the
  # ci-final composition comment in the Makefile for why dagger-test/
  # test-integration must stay out of the CI-provider-independent contract.
  final-sha-dagger-integration:
    runs-on: 'ubuntu-latest'
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
    - name: 'Checkout exact Final SHA'
      uses: 'actions/checkout@v7'
      with:
        ref: '${{ github.sha }}'

    - name: 'Verify checked-out SHA matches the pushed SHA'
      run: |
        EXPECTED="${{ github.sha }}"
        ACTUAL="$(git rev-parse HEAD)"
        echo "Expected (github.sha): $EXPECTED"
        echo "Checked out (git rev-parse HEAD): $ACTUAL"
        if [[ "$EXPECTED" != "$ACTUAL" ]]; then
          echo "❌ Checkout integrity failure: checked-out SHA does not match the pushed SHA"
          exit 1
        fi
        echo "✅ Checked-out SHA matches the pushed SHA"

    - name: 'Set up Go'
      uses: 'actions/setup-go@v7'
      with:
        go-version: '${{ env.GO_VERSION }}'
        cache: false  # Disable default cache to use our custom one

    - name: 'Cache Go modules'
      uses: 'actions/cache@v6'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: "go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-${{ runner.os }}"
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ env.CACHE_VERSION }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false

    - name: 'Install Dagger CLI'
      env:
        DAGGER_VERSION: 'v0.21.8' # keep in sync with dagger.io/dagger in go.mod/providers/*/go.mod
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: 'Verify Dagger CLI is available'
      run: |
        dagger version

    - name: 'Run repository-owned real-Dagger-engine integration contract'
      run: |
        echo "🔌 Running 'make test-integration' against $(git rev-parse HEAD)"
        make test-integration

    - name: 'Run .dagger module security scan'
      run: |
        echo "🔒 Running 'make security-dagger' against $(git rev-parse HEAD)"
        make security-dagger

  # Single, unambiguous aggregator for the Final-SHA verdict. Fail-closed by
  # construction: it only reports VALID when BOTH final-sha-validation and
  # final-sha-dagger-integration succeed for this exact SHA. Any other
  # result for either job — failure, cancellation, or an unexpected skip —
  # falls through to INVALID; see scripts/final-sha-gate-check.sh for the
  # composition logic and its own test suite.
  final-sha-gate:
    runs-on: 'ubuntu-latest'
    needs: ['final-sha-validation', 'final-sha-dagger-integration']
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
    - name: 'Checkout'
      uses: 'actions/checkout@v7'

    - name: 'Final SHA verdict'
      env:
        VALIDATION_RESULT: '${{ needs.final-sha-validation.result }}'
        DAGGER_INTEGRATION_RESULT: '${{ needs.final-sha-dagger-integration.result }}'
      run: |
        echo "SHA: ${{ github.sha }}"
        ./scripts/final-sha-gate-check.sh
