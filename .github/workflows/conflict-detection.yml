name: Conflict Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-conflicts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Check for conflicts and outdated branches
      id: check
      run: |
        echo "🔍 Checking for merge conflicts and branch status..."
        
        # 1. Check for active merge conflicts
        if git diff --name-only --diff-filter=U | grep -q .; then
          echo "❌ Active merge conflicts detected!"
          echo "has_conflicts=true" >> $GITHUB_OUTPUT
          echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only --diff-filter=U >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "✅ No active merge conflicts"
          echo "has_conflicts=false" >> $GITHUB_OUTPUT
        fi
        
        # 2. Check if branch is behind
        if git fetch origin ${{ github.base_ref }} 2>/dev/null; then
          BEHIND_COUNT=$(git rev-list --count HEAD..origin/${{ github.base_ref }} 2>/dev/null || echo "0")
          
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "⚠️ Branch is $BEHIND_COUNT commits behind"
            echo "is_behind=true" >> $GITHUB_OUTPUT
            echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          else
            echo "✅ Branch is up to date"
            echo "is_behind=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "⚠️ Could not fetch base branch, skipping behind check"
          echo "is_behind=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Comment on PR
      if: steps.check.outputs.has_conflicts == 'true' || steps.check.outputs.is_behind == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const hasConflicts = '${{ steps.check.outputs.has_conflicts }}' === 'true';
          const isBehind = '${{ steps.check.outputs.is_behind }}' === 'true';
          const behindCount = '${{ steps.check.outputs.behind_count }}';
          const conflictFiles = '${{ steps.check.outputs.conflict_files }}';
          
          let message = '🚨 **Conflict Detection Alert**\n\n';
          
          if (hasConflicts) {
            message += `❌ **Active merge conflicts detected!**\n\n**Files with conflicts:**\n${conflictFiles}\n\n`;
          }
          
          if (isBehind) {
            message += `⚠️ **Branch is ${behindCount} commits behind** the base branch.\n\n`;
          }
          
          message += `## 🔧 Recommended Actions:\n\n`;
          
          if (hasConflicts) {
            message += `1. **Resolve merge conflicts** in the files listed above\n2. **Test thoroughly** after resolution\n\n`;
          }
          
          if (isBehind) {
            message += `1. **Sync with base branch**: \`git rebase origin/${{ github.base_ref }}\`\n2. **Resolve any conflicts** that arise\n\n`;
          }
          
          message += `---\n*Automated conflict detection*`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: message
          });
