name: Pre-release Pipeline

# GitHub Actions workflow for pre-releases from develop branch
on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g., v0.1.0-beta.1)'
        required: false
        default: ''
      prerelease_type:
        description: 'Pre-release type'
        required: false
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.1'
  BINARY_NAME: 'syntegrity-dagger'
  RELEASE_DIR: 'release'

jobs:
  # Job 1: Determine pre-release version and create tag
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Determine pre-release version
      id: version
      run: |
        echo "🏷️ Determining pre-release version..."
        
        # Check if version is provided via workflow_dispatch
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
          VERSION="${{ github.event.inputs.version }}"
          echo "Using provided version: $VERSION"
        else
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Extract version number
          VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
          echo "Version number: $VERSION_NUMBER"
          
          # Determine version bump based on commit messages
          COMMITS=$(git log --oneline $LATEST_TAG..HEAD)
          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"
          
          # Check for conventional commits
          if echo "$COMMITS" | grep -q "feat!:\|BREAKING CHANGE"; then
            # Major version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1+1".0.0"}')
            echo "Major version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "feat:"; then
            # Minor version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2+1".0"}')
            echo "Minor version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "fix:"; then
            # Patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Patch version bump: $VERSION"
          else
            # Default to patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Default patch version bump: $VERSION"
          fi
        fi
        
        # Get prerelease type
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.prerelease_type }}" ]]; then
          PRERELEASE_TYPE="${{ github.event.inputs.prerelease_type }}"
        else
          PRERELEASE_TYPE="beta"
        fi
        
        # Get prerelease number
        PRERELEASE_NUM=$(git tag | grep "v$VERSION-$PRERELEASE_TYPE" | wc -l)
        PRERELEASE_NUM=$((PRERELEASE_NUM + 1))
        
        FULL_VERSION="v$VERSION-$PRERELEASE_TYPE.$PRERELEASE_NUM"
        TAG="$FULL_VERSION"
        echo "Pre-release version: $FULL_VERSION"
        
        echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "✅ Pre-release version determined: $FULL_VERSION"
        
    - name: Generate changelog
      id: changelog
      run: |
        echo "📝 Generating changelog..."
        
        # Get latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [[ -n "$LATEST_TAG" ]]; then
          # Generate changelog since last tag
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $LATEST_TAG..HEAD)
        else
          # Generate changelog for all commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=10)
        fi
        
        # Save changelog to file
        echo "$CHANGELOG" > CHANGELOG.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Changelog generated"

  # Job 2: Build multi-platform binaries
  build-binaries:
    runs-on: ubuntu-latest
    needs: version
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Build multi-platform binaries
      run: |
        echo "🔨 Building multi-platform binaries..."
        
        # Create release directory
        mkdir -p ${{ env.RELEASE_DIR }}
        
        # Build for different platforms
        GOOS=linux GOARCH=amd64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-linux-amd64-prerelease .
        GOOS=linux GOARCH=arm64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-linux-arm64-prerelease .
        GOOS=darwin GOARCH=amd64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-darwin-amd64-prerelease .
        GOOS=darwin GOARCH=arm64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-darwin-arm64-prerelease .
        GOOS=windows GOARCH=amd64 go build -o ${{ env.RELEASE_DIR }}/${{ env.BINARY_NAME }}-windows-amd64-prerelease.exe .
        
        echo "✅ Multi-platform build completed"
        
    - name: Create release directory and organize binaries
      run: |
        echo "📁 Organizing release artifacts..."
        
        # Create release directory
        mkdir -p ${{ env.RELEASE_DIR }}
        
        # Find and move all built binaries
        find . -name "${{ env.BINARY_NAME }}-*-prerelease*" -type f -exec mv {} ${{ env.RELEASE_DIR }}/ \;
        
        # List files in release directory
        echo "📋 Release artifacts:"
        ls -la ${{ env.RELEASE_DIR }}/
        
        echo "✅ Release artifacts organized"

  # Job 3: Create pre-release
  create-prerelease:
    runs-on: ubuntu-latest
    needs: [version, build-binaries]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: prerelease-binaries-${{ needs.version.outputs.tag }}
        path: ${{ env.RELEASE_DIR }}/
        
    - name: Create pre-release
      run: |
        echo "🚀 Creating pre-release ${{ needs.version.outputs.tag }}..."
        
        # Create tag if it doesn't exist
        if ! git tag -l | grep -q "^${{ needs.version.outputs.tag }}$"; then
          git tag -a "${{ needs.version.outputs.tag }}" -m "Pre-release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"
          echo "✅ Tag created and pushed"
        else
          echo "⚠️ Tag already exists"
        fi
        
        # Create pre-release
        gh release create "${{ needs.version.outputs.tag }}" \
          --title "Pre-release ${{ needs.version.outputs.tag }}" \
          --notes "${{ needs.version.outputs.changelog }}" \
          ${{ env.RELEASE_DIR }}/* \
          --prerelease
          
        echo "✅ Pre-release created"
        
    - name: Upload pre-release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: prerelease-artifacts-${{ needs.version.outputs.tag }}
        path: ${{ env.RELEASE_DIR }}/*
        retention-days: 30
