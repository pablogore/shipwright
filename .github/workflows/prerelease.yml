name: Pre-release Pipeline

# GitHub Actions workflow for pre-releases from develop branch
# NOTE: This workflow is ONLY for manual pre-releases via workflow_dispatch
# Develop branch pushes are handled by consolidated-pipeline.yml (build + test only)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g., v0.1.0-beta.1)'
        required: false
        default: ''
      prerelease_type:
        description: 'Pre-release type'
        required: false
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.1'
  BINARY_NAME: 'syntegrity-dagger'
  RELEASE_DIR: 'release'

jobs:
  # Job 1: Determine pre-release version and create tag
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Determine pre-release version
      id: version
      run: |
        echo "🏷️ Determining pre-release version..."
        
        # Check if version is provided via workflow_dispatch
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
          VERSION="${{ github.event.inputs.version }}"
          echo "Using provided version: $VERSION"
        else
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Extract version number
          VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
          echo "Version number: $VERSION_NUMBER"
          
          # Determine version bump based on commit messages
          COMMITS=$(git log --oneline $LATEST_TAG..HEAD)
          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"
          
          # Check for conventional commits
          if echo "$COMMITS" | grep -q "feat!:\|BREAKING CHANGE"; then
            # Major version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1+1".0.0"}')
            echo "Major version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "feat:"; then
            # Minor version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2+1".0"}')
            echo "Minor version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "fix:"; then
            # Patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Patch version bump: $VERSION"
          else
            # Default to patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Default patch version bump: $VERSION"
          fi
        fi
        
        # Get prerelease type
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.prerelease_type }}" ]]; then
          PRERELEASE_TYPE="${{ github.event.inputs.prerelease_type }}"
        else
          PRERELEASE_TYPE="beta"
        fi
        
        # Get prerelease number
        PRERELEASE_NUM=$(git tag | grep "v$VERSION-$PRERELEASE_TYPE" | wc -l)
        PRERELEASE_NUM=$((PRERELEASE_NUM + 1))
        
        FULL_VERSION="v$VERSION-$PRERELEASE_TYPE.$PRERELEASE_NUM"
        TAG="$FULL_VERSION"
        echo "Pre-release version: $FULL_VERSION"
        
        echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "✅ Pre-release version determined: $FULL_VERSION"
        
    - name: Generate changelog
      id: changelog
      run: |
        echo "📝 Generating changelog..."
        
        # Get latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [[ -n "$LATEST_TAG" ]]; then
          # Generate changelog since last tag
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $LATEST_TAG..HEAD)
        else
          # Generate changelog for all commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=10)
        fi
        
        # Save changelog to file
        echo "$CHANGELOG" > CHANGELOG.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Changelog generated"

  # Job 2: Build multi-platform binaries
  build-binaries:
    runs-on: ubuntu-latest
    needs: version
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Run GoReleaser (Pre-release)
      uses: goreleaser/goreleaser-action@v5
      with:
        distribution: goreleaser
        version: latest
        args: release --clean --snapshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}

    - name: Upload pre-release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: prerelease-artifacts-${{ needs.version.outputs.tag }}
        path: dist/*
        retention-days: 30
