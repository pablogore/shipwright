name: Pre-release Pipeline

# GitHub Actions workflow for pre-releases from develop branch
on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g., v0.1.0-beta.1)'
        required: false
        default: ''
      prerelease_type:
        description: 'Pre-release type'
        required: false
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.1'
  BINARY_NAME: 'syntegrity-dagger'
  RELEASE_DIR: 'release'

jobs:
  # Job 1: Determine pre-release version and create tag
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git and Go for private repos
      env:
        ORG_CHECKOUT_TOKEN: ${{ secrets.ORG_CHECKOUT_TOKEN }}
      run: |
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password ${{ secrets.ORG_CHECKOUT_TOKEN }}" >> ~/.netrc
        chmod 600 ~/.netrc
        # Configure Git authentication
        git config --global url."https://x-access-token:${{ secrets.ORG_CHECKOUT_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.ORG_CHECKOUT_TOKEN }}@github.com/".insteadOf "git@github.com:"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
    - name: Determine pre-release version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Generate pre-release version based on type
            PRERELEASE_TYPE="${{ github.event.inputs.prerelease_type }}"
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            VERSION_NUM=$(echo $LATEST_TAG | sed 's/v//' | sed 's/-.*//')
            MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
            MINOR=$(echo $VERSION_NUM | cut -d. -f2)
            PATCH=$(echo $VERSION_NUM | cut -d. -f3)
            
            # For pre-releases, increment minor version
            MINOR=$((MINOR + 1))
            PATCH=0
            
            # Find existing pre-release number for this type
            EXISTING_PRERELEASES=$(git tag -l "v${MAJOR}.${MINOR}.${PATCH}-${PRERELEASE_TYPE}.*" | wc -l)
            PRERELEASE_NUM=$((EXISTING_PRERELEASES + 1))
            
            VERSION="v${MAJOR}.${MINOR}.${PATCH}-${PRERELEASE_TYPE}.${PRERELEASE_NUM}"
          fi
        else
          # Auto-generate pre-release version from develop
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION_NUM=$(echo $LATEST_TAG | sed 's/v//' | sed 's/-.*//')
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)
          
          # For develop branch, increment minor version
          MINOR=$((MINOR + 1))
          PATCH=0
          
          # Find existing beta pre-releases for this version
          EXISTING_BETAS=$(git tag -l "v${MAJOR}.${MINOR}.${PATCH}-beta.*" | wc -l)
          BETA_NUM=$((EXISTING_BETAS + 1))
          
          VERSION="v${MAJOR}.${MINOR}.${PATCH}-beta.${BETA_NUM}"
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$VERSION" >> $GITHUB_OUTPUT
        echo "🎯 Determined pre-release version: $VERSION"
        
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [[ -n "$LAST_TAG" ]]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=20)
        fi
        
        # Create changelog file
        cat > CHANGELOG.md << EOF
        # Pre-release Changelog - ${{ steps.version.outputs.version }}
        
        ## Changes in this pre-release:
        $CHANGELOG
        
        ## Full Changelog
        https://github.com/${{ github.repository }}/compare/$LAST_TAG...${{ steps.version.outputs.tag }}
        EOF
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "📝 Generated pre-release changelog"
        
    - name: Create and push tag
      run: |
        git tag -a "${{ steps.version.outputs.tag }}" -m "Pre-release ${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
        echo "🏷️ Created and pushed pre-release tag: ${{ steps.version.outputs.tag }}"

  # Job 2: Build binaries for multiple platforms
  build-binaries:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git and Go for private repos
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ORG_CHECKOUT_TOKEN: ${{ secrets.ORG_CHECKOUT_TOKEN }}
      run: |
        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password ${{ secrets.ORG_CHECKOUT_TOKEN }}" >> ~/.netrc
        chmod 600 ~/.netrc
        # Configure Git authentication
        git config --global url."https://x-access-token:${{ secrets.ORG_CHECKOUT_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.ORG_CHECKOUT_TOKEN }}@github.com/".insteadOf "git@github.com:"
        echo "🏷️ Using pre-release tag from version job: ${{ needs.version.outputs.tag }}"
        
    - name: Build binary
      run: |
        echo "🔨 Building pre-release binary for ${{ matrix.os }}/${{ matrix.arch }}..."
        GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${{ needs.version.outputs.version }}" -o ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./main.go
        echo "✅ Pre-release binary built: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
        
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}-prerelease
        path: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
        retention-days: 30

  # Job 3: Create GitHub Pre-release
  release:
    runs-on: ubuntu-latest
    needs: [version, build-binaries]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release directory and organize binaries
      run: |
        mkdir -p ${{ env.RELEASE_DIR }}
        # Find and move all binaries from artifact directories
        find . -name "${{ env.BINARY_NAME }}-*" -type f -exec mv {} ${{ env.RELEASE_DIR }}/ \;
        # List what we have in the release directory
        echo "📦 Binaries in release directory:"
        ls -la ${{ env.RELEASE_DIR }}/
        
    - name: Generate checksums
      run: |
        cd ${{ env.RELEASE_DIR }}
        sha256sum * > checksums.txt
        echo "Generated checksums:"
        cat checksums.txt
        
    - name: Create pre-release notes
      run: |
        cat > release-notes.md << EOF
        # Pre-release ${{ needs.version.outputs.version }}
        
        ⚠️ **This is a pre-release version. Use with caution in production environments.**
        
        ## 📦 Binaries
        This pre-release includes pre-compiled binaries for multiple platforms:
        
        - **Linux AMD64**: \`${{ env.BINARY_NAME }}-linux-amd64\`
        - **Linux ARM64**: \`${{ env.BINARY_NAME }}-linux-arm64\`
        - **macOS AMD64**: \`${{ env.BINARY_NAME }}-darwin-amd64\`
        - **macOS ARM64**: \`${{ env.BINARY_NAME }}-darwin-arm64\`
        - **Windows AMD64**: \`${{ env.BINARY_NAME }}-windows-amd64.exe\`
        
        ## 🔧 Installation
        \`\`\`bash
        # Download the appropriate binary for your platform
        curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/${{ env.BINARY_NAME }}-linux-amd64 -o ${{ env.BINARY_NAME }}
        chmod +x ${{ env.BINARY_NAME }}
        \`\`\`
        
        ## 📋 Changelog
        ${{ needs.version.outputs.changelog }}
        
        ## 🚀 Testing
        Please test this pre-release and report any issues in the [Issues](https://github.com/${{ github.repository }}/issues) section.
        EOF
        
    - name: Create GitHub Pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: Pre-release ${{ needs.version.outputs.tag }}
        body_path: release-notes.md
        files: |
          ${{ env.RELEASE_DIR }}/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update pre-release info
      run: |
        echo "🔗 Pre-release created: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}"
        echo "📥 Direct download: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/${{ env.BINARY_NAME }}-linux-amd64"
