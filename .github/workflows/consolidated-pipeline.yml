name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v0.1.0)'
        required: false
        default: ''
      release_type:
        description: 'Release type'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - prerelease
      prerelease_type:
        description: 'Pre-release type (if applicable)'
        required: false
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.5'
  BINARY_NAME: 'syntegrity-dagger'
  RELEASE_DIR: 'release'
  CACHE_VERSION: v1

jobs:
  # Stage 1: Determine pipeline type and version
  determine-pipeline:
    runs-on: ubuntu-latest
    # Skip CI for tag pushes (handled by release workflow)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      pipeline-type: ${{ steps.determine.outputs.type }}
      run-security: ${{ steps.determine.outputs.security }}
      run-coverage: ${{ steps.determine.outputs.coverage }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        token: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Determine pipeline type
      id: determine
      run: |
        echo "🔍 Analyzing pipeline context..."
        echo "Event: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Base ref: ${{ github.base_ref }}"
        echo "Commit message: ${{ github.event.head_commit.message }}"
        
        # Determine pipeline type based on context
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "type=pr" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Pull Request (full pipeline)"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          # Main branch: build + test + security (NO release - handled by release.yml)
          echo "type=main" >> $GITHUB_OUTPUT
          echo "security=true" >> $GITHUB_OUTPUT
          echo "coverage=true" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Main branch (build + test + security)"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          # Develop branch: build + test only (NO release)
          echo "type=develop" >> $GITHUB_OUTPUT
          echo "security=false" >> $GITHUB_OUTPUT
          echo "coverage=false" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Develop branch (build + test only)"
        else
          echo "type=feature" >> $GITHUB_OUTPUT
          echo "security=false" >> $GITHUB_OUTPUT
          echo "coverage=false" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "📋 Pipeline: Feature branch (basic pipeline)"
        fi
        

  # Stage 2: Build and Test (Parallel)
  build:
    runs-on: ubuntu-latest
    needs: determine-pipeline
    if: ${{ always() && (needs.determine-pipeline.result == 'success' || needs.determine-pipeline.outputs.pipeline-type == 'pr') }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Build
      run: |
        echo "🔨 Building application..."
        go build -o ${{ env.BINARY_NAME }} .
        echo "✅ Build completed"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BINARY_NAME }}-${{ runner.os }}-${{ runner.arch }}
        path: ${{ env.BINARY_NAME }}
        retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: determine-pipeline
    if: ${{ always() && (needs.determine-pipeline.result == 'success' || needs.determine-pipeline.outputs.pipeline-type == 'pr') }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Run tests
      run: |
        echo "🧪 Running tests..."
        go test -v ./...
        echo "✅ Tests completed"

  security:
    runs-on: ubuntu-latest
    needs: determine-pipeline
    if: ${{ needs.determine-pipeline.outputs.run-security == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.SYNTEGRITY_DAGGER_TOKEN }}
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Run security scan
      run: |
        echo "🔒 Running security scan..."
        # Use go vet for basic security checks
        go vet ./...
        # Check for common security issues
        go list -json -deps ./... | grep -i "crypto\|hash\|rand" || true
        echo "✅ Security scan completed"

  # Note: Release is handled by separate release.yml workflow
  # This workflow only does build + test for all branches
