name: Release Pipeline

# This workflow runs when:
# 1. A tag is pushed (manual release)
# 2. Merge to main branch (automatic release with auto-tagging)
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Version tags (v1.0.0, v2.1.3, etc.)

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.3'
  BINARY_NAME: 'syntegrity-dagger'

jobs:
  # Job 1: Validate tag and prepare release
  validate-release:
    runs-on: ubuntu-latest  # Changed from [self-hosted,linux,go] for testing
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      type: ${{ steps.tag.outputs.type }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Determine release type and version
      id: tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Manual release via tag
          echo "🏷️ Manual release via tag: ${{ github.ref_name }}"
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "type=manual" >> $GITHUB_OUTPUT
        else
          # Automatic release via merge to main
          echo "🚀 Automatic release via merge to main"
          
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Check commit message to determine version bump type
          # Look for conventional commit types in the merge commit or recent commits
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # Determine version bump based on commit message
          if echo "$COMMIT_MSG" | grep -qiE "^(feat|feature)(\(.+\))?:"; then
            # Feature: bump minor version
            echo "📦 Feature detected: bumping minor version"
            VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2+1".0"}')
          elif echo "$COMMIT_MSG" | grep -qiE "^(fix|bugfix|hotfix)(\(.+\))?:"; then
            # Fix: bump patch version
            echo "🔧 Fix detected: bumping patch version"
            VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
          elif echo "$COMMIT_MSG" | grep -qiE "^(breaking|BREAKING)"; then
            # Breaking change: bump major version
            echo "⚠️ Breaking change detected: bumping major version"
            VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1+1".0.0"}')
          else
            # Default: bump patch version
            echo "📝 Default: bumping patch version"
            VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
          fi
          
          TAG="v$VERSION"
          echo "type=automatic" >> $GITHUB_OUTPUT
          echo "auto_tag=true" >> $GITHUB_OUTPUT
        fi
        
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Release information determined: $TAG"
        
    - name: Generate changelog
      id: changelog
      run: |
        echo "📝 Generating changelog for release..."
        
        # Get the latest tag (before this release)
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "Latest tag: $LATEST_TAG"
        
        # Get the version that will be released
        RELEASE_VERSION="${{ steps.tag.outputs.version }}"
        RELEASE_TAG="${{ steps.tag.outputs.tag }}"
        
        if [[ -n "$LATEST_TAG" ]]; then
          # Generate changelog since previous tag
          echo "Generating changelog from $LATEST_TAG to HEAD..."
          
          # Get commits since last tag, grouped by type
          FEATURES=$(git log --pretty=format:"- %s (%h)" --grep="^feat" --grep="^feature" -i $LATEST_TAG..HEAD 2>/dev/null || echo "")
          FIXES=$(git log --pretty=format:"- %s (%h)" --grep="^fix" --grep="^bugfix" --grep="^hotfix" -i $LATEST_TAG..HEAD 2>/dev/null || echo "")
          BREAKING=$(git log --pretty=format:"- %s (%h)" --grep="BREAKING" -i $LATEST_TAG..HEAD 2>/dev/null || echo "")
          OTHERS=$(git log --pretty=format:"- %s (%h)" $LATEST_TAG..HEAD --grep="^feat" --grep="^feature" --grep="^fix" --grep="^bugfix" --grep="^hotfix" --grep="BREAKING" -i --invert-grep 2>/dev/null || echo "")
          
          # Build structured changelog
          CHANGELOG="## Release $RELEASE_TAG"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"**Release Date:** $(date +%Y-%m-%d)"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"### Changes since $LATEST_TAG"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'
          
          if [[ -n "$BREAKING" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### ⚠️ Breaking Changes"
            CHANGELOG="$CHANGELOG"$'\n'"$BREAKING"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi
          
          if [[ -n "$FEATURES" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### ✨ Features"
            CHANGELOG="$CHANGELOG"$'\n'"$FEATURES"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi
          
          if [[ -n "$FIXES" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### 🐛 Bug Fixes"
            CHANGELOG="$CHANGELOG"$'\n'"$FIXES"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi
          
          if [[ -n "$OTHERS" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### 📝 Other Changes"
            CHANGELOG="$CHANGELOG"$'\n'"$OTHERS"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi
          
          # If no categorized commits, get all commits
          if [[ -z "$FEATURES" && -z "$FIXES" && -z "$BREAKING" && -z "$OTHERS" ]]; then
            ALL_COMMITS=$(git log --pretty=format:"- %s (%h)" $LATEST_TAG..HEAD)
            CHANGELOG="$CHANGELOG"$'\n'"#### 📋 All Changes"
            CHANGELOG="$CHANGELOG"$'\n'"$ALL_COMMITS"
          fi
        else
          # First release - generate changelog for all commits
          echo "First release - generating changelog for all commits..."
          ALL_COMMITS=$(git log --pretty=format:"- %s (%h)" --max-count=50)
          CHANGELOG="## Release $RELEASE_TAG"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"**Release Date:** $(date +%Y-%m-%d)"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"### Initial Release"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"$ALL_COMMITS"
        fi
        
        # Save changelog to file for GoReleaser
        echo "$CHANGELOG" > CHANGELOG.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Changelog generated for release"
        echo ""
        echo "Preview:"
        echo "$CHANGELOG" | head -20

  # Job 2: Build and test before release
  build-and-test:
    runs-on: ubuntu-latest  # Changed from [self-hosted,linux,go] for testing
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Build
      run: |
        echo "🔨 Building application..."
        go build -o ${{ env.BINARY_NAME }} .
        echo "✅ Build completed"
        
    - name: Run tests
      run: |
        echo "🧪 Running tests..."
        go test -v ./...
        echo "✅ Tests completed"
        
    - name: Run security scan
      run: |
        echo "🔒 Running security scan..."
        go vet ./...
        echo "✅ Security scan completed"

  # Job 3: Create release with GoReleaser
  create-release:
    runs-on: ubuntu-latest  # Changed from [self-hosted,linux,go] for testing
    needs: [validate-release, build-and-test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Create tag (automatic release only)
      if: needs.validate-release.outputs.type == 'automatic'
      run: |
        echo "🏷️ Creating tag ${{ needs.validate-release.outputs.tag }} for automatic release..."
        
        # Create tag if it doesn't exist
        if ! git tag -l | grep -q "^${{ needs.validate-release.outputs.tag }}$"; then
          git tag -a "${{ needs.validate-release.outputs.tag }}" -m "Release ${{ needs.validate-release.outputs.tag }}"
          git push origin "${{ needs.validate-release.outputs.tag }}"
          echo "✅ Tag created and pushed: ${{ needs.validate-release.outputs.tag }}"
        else
          echo "⚠️ Tag already exists: ${{ needs.validate-release.outputs.tag }}"
        fi
        
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v5
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Prepare raw binaries for direct download
      run: |
        echo "📦 Preparing raw binaries for direct download..."
        mkdir -p raw-binaries
        
        # Extract binaries from archives and rename them
        cd dist
        
        # Process Linux binaries
        for file in syntegrity-dagger_*_linux_amd64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" syntegrity-dagger
            mv syntegrity-dagger ../raw-binaries/syntegrity-dagger-linux-amd64
            chmod +x ../raw-binaries/syntegrity-dagger-linux-amd64
          fi
        done
        
        for file in syntegrity-dagger_*_linux_arm64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" syntegrity-dagger
            mv syntegrity-dagger ../raw-binaries/syntegrity-dagger-linux-arm64
            chmod +x ../raw-binaries/syntegrity-dagger-linux-arm64
          fi
        done
        
        # Process Darwin (macOS) binaries
        for file in syntegrity-dagger_*_darwin_amd64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" syntegrity-dagger
            mv syntegrity-dagger ../raw-binaries/syntegrity-dagger-darwin-amd64
            chmod +x ../raw-binaries/syntegrity-dagger-darwin-amd64
          fi
        done
        
        for file in syntegrity-dagger_*_darwin_arm64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" syntegrity-dagger
            mv syntegrity-dagger ../raw-binaries/syntegrity-dagger-darwin-arm64
            chmod +x ../raw-binaries/syntegrity-dagger-darwin-arm64
          fi
        done
        
        # Process Windows binaries
        for file in syntegrity-dagger_*_windows_amd64.zip; do
          if [ -f "$file" ]; then
            unzip -q "$file" syntegrity-dagger.exe
            mv syntegrity-dagger.exe ../raw-binaries/syntegrity-dagger-windows-amd64.exe
          fi
        done
        
        cd ..
        echo "✅ Raw binaries prepared:"
        ls -lh raw-binaries/
    
    - name: Setup GitHub CLI
      run: |
        if ! command -v gh &> /dev/null; then
          echo "Installing GitHub CLI..."
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
        fi
        gh --version
    
    - name: Upload raw binaries to GitHub Release
      run: |
        echo "Uploading raw binaries to GitHub Release..."
        cd raw-binaries
        
        # Upload each binary to the release
        for binary in *; do
          if [ -f "$binary" ]; then
            echo "Uploading $binary..."
            gh release upload "${{ needs.validate-release.outputs.tag }}" "$binary" --clobber
          fi
        done
        
        echo "✅ Raw binaries uploaded successfully"
        echo ""
        echo "📦 Available binaries for download:"
        ls -lh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update CHANGELOG.md in repository
      if: needs.validate-release.outputs.type == 'automatic'
      run: |
        echo "📝 Updating CHANGELOG.md in repository..."
        
        # Checkout the repository to update CHANGELOG.md
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Read the generated changelog
        NEW_CHANGELOG_ENTRY=$(cat CHANGELOG.md)
        
        # Read existing CHANGELOG.md
        if [ -f CHANGELOG.md ]; then
          # Create backup
          cp CHANGELOG.md CHANGELOG.md.backup
          
          # Prepend new release to CHANGELOG.md
          {
            echo "$NEW_CHANGELOG_ENTRY"
            echo ""
            echo "---"
            echo ""
            cat CHANGELOG.md.backup | sed '/^## \[Unreleased\]/,$d'
          } > CHANGELOG.md.new
          
          # Add Unreleased section back if it existed
          if grep -q "^## \[Unreleased\]" CHANGELOG.md.backup; then
            {
              cat CHANGELOG.md.new
              echo ""
              echo "## [Unreleased]"
              echo ""
              echo "### Added"
              echo "- Changes in progress..."
            } > CHANGELOG.md
          else
            mv CHANGELOG.md.new CHANGELOG.md
          fi
          
          # Commit and push the updated CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ needs.validate-release.outputs.tag }}" || echo "No changes to commit"
          git push origin main || echo "Push failed or no changes"
          
          echo "✅ CHANGELOG.md updated in repository"
        else
          echo "⚠️ CHANGELOG.md not found, creating new one"
          echo "$NEW_CHANGELOG_ENTRY" > CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: add CHANGELOG.md for ${{ needs.validate-release.outputs.tag }}"
          git push origin main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ needs.validate-release.outputs.tag }}
        path: |
          dist/*
          raw-binaries/*
        retention-days: 30
        
    - name: Release summary
      run: |
        echo "🎉 Release ${{ needs.validate-release.outputs.tag }} created successfully!"
        echo "📦 Artifacts uploaded to GitHub Releases"
        echo "📝 Changelog generated and included"
        echo "🔗 Raw binaries available for direct download:"
        echo "   - syntegrity-dagger-linux-amd64"
        echo "   - syntegrity-dagger-linux-arm64"
        echo "   - syntegrity-dagger-darwin-amd64"
        echo "   - syntegrity-dagger-darwin-arm64"
        echo "   - syntegrity-dagger-windows-amd64.exe"
