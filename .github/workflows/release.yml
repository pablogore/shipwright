name: 'Release Pipeline'

# This workflow runs when:
# 1. A tag is pushed (manual release via git tag)
# 2. CI completes successfully on main after merge from develop (automatic release)
# 3. Manual trigger via workflow_dispatch (admin only)
on:
  push:
    tags:
      - 'v*'  # Version tags (v1.0.0, v2.1.3, etc.) - Manual release via tag push
  # Note: CI now triggers releases via workflow_dispatch to ensure the latest workflow version from main is always used
  workflow_dispatch:
    # Manual release trigger - Only admins can trigger
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0) - Leave empty to auto-detect'
        required: false
        type: 'string'
      commit_sha:
        description: 'Commit SHA to release (defaults to latest main)'
        required: false
        type: 'string'

permissions:
  contents: 'write'
  packages: 'write'
  id-token: 'write'
  checks: 'read'

env:
  BINARY_NAME: 'shipwright'

jobs:
  # Job 0: Verify admin permissions (only for manual workflow_dispatch without commit_sha)
  # Tag pushes and automatic releases (with commit_sha) don't need this check
  check-admin:
    runs-on: 'ubuntu-latest'
    if: "github.event_name == 'workflow_dispatch'"
    steps:
    - name: 'Check if manual trigger (no commit_sha)'
      id: 'check-manual'
      run: |
        if [[ -z "${{ inputs.commit_sha }}" ]]; then
          echo "is_manual=true" >> $GITHUB_OUTPUT
        else
          echo "is_manual=false" >> $GITHUB_OUTPUT
        fi
    - name: 'Check admin permissions'
      if: "steps.check-manual.outputs.is_manual == 'true'"
      uses: 'actions/github-script@v9'
      with:
        script: |
          const { data: user } = await github.rest.users.getByUsername({
            username: context.actor
          });

          // Check if user is admin (has write/admin permissions)
          const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
            owner: context.repo.owner,
            repo: context.repo.repo,
            username: context.actor
          });

          if (permission.permission !== 'admin' && permission.permission !== 'write') {
            core.setFailed(`❌ Access denied: Only repository admins can trigger releases. Current permission: ${permission.permission}`);
            return;
          }

          console.log(`✅ Admin permission verified for ${context.actor} (${permission.permission})`);

  # Job 1: Validate tag and prepare release
  validate-release:
    runs-on: 'ubuntu-latest'  # Changed from [self-hosted,linux,go] for testing
    needs: ['check-admin']
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.commit_sha != '' || needs.check-admin.result == 'success' || needs.check-admin.result == 'skipped')) ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      )
    outputs:
      tag: '${{ steps.tag.outputs.tag }}'
      version: '${{ steps.tag.outputs.version }}'
      type: '${{ steps.tag.outputs.type }}'
      changelog: '${{ steps.changelog.outputs.changelog }}'
      source_branch: '${{ steps.tag.outputs.source_branch }}'
    steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        # For workflow_dispatch, use commit_sha input if provided, otherwise use main
        # For tag push, use the tag
        ref: "${{ github.event_name == 'workflow_dispatch' && (inputs.commit_sha || 'main') || github.sha }}"
        # token: Uses GITHUB_TOKEN by default (automatically provided by GitHub Actions)

    - name: 'Set up Go'
      uses: 'actions/setup-go@v7'
      with:
        go-version-file: '.go-version'

    - name: 'Configure Git'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: 'Configure Git for private repos'
      continue-on-error: true
      run: |
        if [ -n "$SHIPWRIGHT_TOKEN" ]; then
          git config --global url."https://$SHIPWRIGHT_TOKEN@github.com/".insteadOf "https://github.com/"
        fi
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'

    - name: 'Determine release type and version'
      id: 'tag'
      run: |
        # Determine if this is a tag push or workflow_dispatch from CI
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
          # Manual release via tag
          echo "🏷️ Manual release via tag: ${{ github.ref_name }}"
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "type=manual" >> $GITHUB_OUTPUT
          echo "source_branch=tag" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.commit_sha }}" ]]; then
          # Automatic release via workflow_dispatch from CI (with commit_sha)
          echo "🚀 Automatic release triggered by CI via workflow_dispatch (commit: ${{ inputs.commit_sha }})"

          # Detect source branch from merge commit message or recent commits
          SOURCE_BRANCH=""
          MERGE_COMMIT=$(git log -1 --pretty=%B)
          if echo "$MERGE_COMMIT" | grep -qE "Merge pull request|Merge branch"; then
            # Extract branch name from merge commit
            SOURCE_BRANCH=$(echo "$MERGE_COMMIT" | grep -oE "from [^ ]+" | sed 's/from //' || echo "")
            echo "📋 Detected source branch from merge commit: $SOURCE_BRANCH"
          fi
          # Also check recent commits for branch info
          if [[ -z "$SOURCE_BRANCH" ]]; then
            SOURCE_BRANCH=$(git log --oneline -10 | grep -iE "hotfix|develop" | head -1 | grep -oE "(hotfix|develop)[^ ]*" | head -1 || echo "")
            if [[ -n "$SOURCE_BRANCH" ]]; then
              echo "📋 Detected source branch from commit history: $SOURCE_BRANCH"
            fi
          fi

          # Only proceed if merge comes from develop branch
          if [[ "$SOURCE_BRANCH" != "develop" ]] && ! echo "$SOURCE_BRANCH" | grep -qiE "^develop"; then
            echo "⚠️ Release skipped: Merge is not from develop branch (detected: $SOURCE_BRANCH)"
            echo "ℹ️ Only merges from develop to main trigger automatic releases"
            echo "ℹ️ Use workflow_dispatch without commit_sha for manual releases"
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Merge from develop detected - proceeding with automatic release"

          # Continue with automatic release logic (only for workflow_dispatch from CI with develop merge)
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT

          # Get latest tag (--match excludes providers/go/v* so a provider
          # release can never be picked up as the root's LATEST_TAG)
          LATEST_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Determine version bump based on source branch and commit messages
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Check if merge comes from hotfix branch
          if echo "$SOURCE_BRANCH" | grep -qiE "^hotfix/"; then
            # Hotfix: always bump patch version
            echo "🔥 Hotfix detected from branch: $SOURCE_BRANCH - bumping patch version"
            VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
          else
            # Merge from develop: determine based on commit messages
            echo "🌿 Merge from develop branch - analyzing commits"

            # Check commit messages in the merge
            if echo "$COMMIT_MSG" | grep -qiE "^(breaking|BREAKING)"; then
              # Breaking change: bump major version
              echo "⚠️ Breaking change detected: bumping major version"
              VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
              VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1+1".0.0"}')
            elif echo "$COMMIT_MSG" | grep -qiE "^(feat|feature)(\(.+\))?:"; then
              # Feature: bump minor version
              echo "📦 Feature detected: bumping minor version"
              VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
              VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2+1".0"}')
            else
              # Default for develop: bump minor version (develop usually has features)
              echo "📝 Default for develop: bumping minor version"
              VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
              VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2+1".0"}')
            fi
          fi

          TAG="v$VERSION"
          echo "type=automatic" >> $GITHUB_OUTPUT
          echo "auto_tag=true" >> $GITHUB_OUTPUT
        else
          # Manual release via workflow_dispatch
          echo "🔧 Manual release triggered by admin via workflow_dispatch"
          SOURCE_BRANCH="manual"

          # Check if version was provided manually
          if [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            VERSION=$(echo "$TAG" | sed 's/^v//')
            echo "type=manual" >> $GITHUB_OUTPUT
            echo "source_branch=manual" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT

          # Get latest tag (--match excludes providers/go/v* so a provider
          # release can never be picked up as the root's LATEST_TAG)
          LATEST_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # For manual releases, default to patch version bump
          echo "📝 Manual release: defaulting to patch version bump"
          VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
          VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
          TAG="v$VERSION"
          echo "type=manual" >> $GITHUB_OUTPUT
          echo "source_branch=manual" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Release information determined: $TAG"

    - name: 'Validate release version shape'
      run: |
        TAG="${{ steps.tag.outputs.tag }}"
        # internal/releaseguard/tags_test.go extracts this exact assignment
        # -- keep it byte-for-byte in sync with design.md D6 and
        # release-provider-go.yml's SHAPE_REGEX. Major is restricted to 0|1
        # on purpose: major >= 2 needs a root module path suffix (/v2) that
        # does not exist yet -- a decision, not a tag typo. The required
        # leading "v" also guarantees a providers/*/vX.Y.Z tag can never be
        # mistaken for a root version here.
        SHAPE_REGEX='^v(0|1)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
        if ! [[ "$TAG" =~ $SHAPE_REGEX ]]; then
          echo "::error::Tag '$TAG' does not match the root release's SemVer shape ($SHAPE_REGEX)."
          echo "::error::A major version >= 2 needs a root module path suffix (/v2) -- this is a decision, not a tag typo."
          exit 1
        fi
        echo "✅ Version shape valid: $TAG"

    - name: 'Generate changelog'
      id: 'changelog'
      run: |
        echo "📝 Generating changelog for release..."

        # Get the latest tag (before this release; --match excludes
        # providers/go/v* so a provider release can never be picked up here)
        LATEST_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo "")
        echo "Latest tag: $LATEST_TAG"

        # Get the version that will be released
        RELEASE_VERSION="${{ steps.tag.outputs.version }}"
        RELEASE_TAG="${{ steps.tag.outputs.tag }}"

        if [[ -n "$LATEST_TAG" ]]; then
          # Generate changelog since previous tag
          echo "Generating changelog from $LATEST_TAG to HEAD..."

          # Get commits since last tag, grouped by type
          FEATURES=$(git log --pretty=format:"- %s (%h)" --grep="^feat" --grep="^feature" -i $LATEST_TAG..HEAD 2>/dev/null || echo "")
          FIXES=$(git log --pretty=format:"- %s (%h)" --grep="^fix" --grep="^bugfix" --grep="^hotfix" -i $LATEST_TAG..HEAD 2>/dev/null || echo "")
          BREAKING=$(git log --pretty=format:"- %s (%h)" --grep="BREAKING" -i $LATEST_TAG..HEAD 2>/dev/null || echo "")
          OTHERS=$(git log --pretty=format:"- %s (%h)" $LATEST_TAG..HEAD --grep="^feat" --grep="^feature" --grep="^fix" --grep="^bugfix" --grep="^hotfix" --grep="BREAKING" -i --invert-grep 2>/dev/null || echo "")

          # Build structured changelog
          CHANGELOG="## Release $RELEASE_TAG"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"**Release Date:** $(date +%Y-%m-%d)"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"### Changes since $LATEST_TAG"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'

          if [[ -n "$BREAKING" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### ⚠️ Breaking Changes"
            CHANGELOG="$CHANGELOG"$'\n'"$BREAKING"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi

          if [[ -n "$FEATURES" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### ✨ Features"
            CHANGELOG="$CHANGELOG"$'\n'"$FEATURES"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi

          if [[ -n "$FIXES" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### 🐛 Bug Fixes"
            CHANGELOG="$CHANGELOG"$'\n'"$FIXES"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi

          if [[ -n "$OTHERS" ]]; then
            CHANGELOG="$CHANGELOG"$'\n'"#### 📝 Other Changes"
            CHANGELOG="$CHANGELOG"$'\n'"$OTHERS"
            CHANGELOG="$CHANGELOG"$'\n'$'\n'
          fi

          # If no categorized commits, get all commits
          if [[ -z "$FEATURES" && -z "$FIXES" && -z "$BREAKING" && -z "$OTHERS" ]]; then
            ALL_COMMITS=$(git log --pretty=format:"- %s (%h)" $LATEST_TAG..HEAD)
            CHANGELOG="$CHANGELOG"$'\n'"#### 📋 All Changes"
            CHANGELOG="$CHANGELOG"$'\n'"$ALL_COMMITS"
          fi
        else
          # First release - generate changelog for all commits
          echo "First release - generating changelog for all commits..."
          ALL_COMMITS=$(git log --pretty=format:"- %s (%h)" --max-count=50)
          CHANGELOG="## Release $RELEASE_TAG"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"**Release Date:** $(date +%Y-%m-%d)"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"### Initial Release"
          CHANGELOG="$CHANGELOG"$'\n'$'\n'"$ALL_COMMITS"
        fi

        # Save changelog to file for GoReleaser
        echo "$CHANGELOG" > CHANGELOG.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "✅ Changelog generated for release"
        echo ""
        echo "Preview:"
        echo "$CHANGELOG" | head -20

  # Job 2: Create release with GoReleaser
  # Note: Build and test are already validated by CI workflow before this release runs
  create-release:
    runs-on: 'ubuntu-latest'  # Changed from [self-hosted,linux,go] for testing
    needs: ['validate-release']
    # Only run if triggered by workflow_dispatch (manual admin or CI), or tag push
    if: |
      always() &&
      needs.validate-release.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      )
    steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        fetch-depth: 0
        fetch-tags: true  # Fetch all tags to ensure tag validation works
        # For workflow_dispatch, use commit_sha input if provided, otherwise use main
        # For tag push, use the tag
        ref: "${{ github.event_name == 'workflow_dispatch' && (inputs.commit_sha || 'main') || github.sha }}"
        # token: Uses GITHUB_TOKEN by default (automatically provided by GitHub Actions)

    - name: 'Resolve and verify exact release SHA'
      id: 'provenance'
      run: |
        RESOLVED_SHA="$(git rev-parse HEAD)"
        echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
        echo "📍 Checked out commit: $RESOLVED_SHA"

        if [[ "${{ github.event_name }}" == "push" ]]; then
          EXPECTED_SHA="${{ github.sha }}"
        elif [[ -n "${{ inputs.commit_sha }}" ]]; then
          EXPECTED_SHA="$(git rev-parse "${{ inputs.commit_sha }}")"
        else
          EXPECTED_SHA=""
        fi

        if [[ -n "$EXPECTED_SHA" && "$RESOLVED_SHA" != "$EXPECTED_SHA" ]]; then
          echo "::error::Checkout resolved to $RESOLVED_SHA but the release was requested for $EXPECTED_SHA. Refusing to build the wrong commit."
          exit 1
        fi
        echo "✅ Checkout matches the requested release commit"

    - name: 'Verify commit passed Final-SHA gate'
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      run: |
        SHA="${{ steps.provenance.outputs.sha }}"
        CONCLUSION="$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs" --jq '[.check_runs[] | select(.name=="final-sha-gate")] | sort_by(.completed_at) | last | .conclusion // empty')"
        if [ "$CONCLUSION" != "success" ]; then
          echo "::error::Commit ${SHA} has no successful final-sha-gate check-run (found: '${CONCLUSION:-none}'). Refusing to release a commit that never passed the production-critical contract."
          exit 1
        fi
        echo "✅ final-sha-gate=success verified for commit ${SHA}"

    - name: 'Set up Go'
      uses: 'actions/setup-go@v7'
      with:
        go-version-file: '.go-version'

    - name: 'Configure Git'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: 'Configure Git and Go for private repos'
      env:
        SHIPWRIGHT_TOKEN: '${{ secrets.SHIPWRIGHT_TOKEN }}'
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SHIPWRIGHT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SHIPWRIGHT_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SHIPWRIGHT_TOKEN secret with a token that has 'repo' scope"
            echo ""
            echo "📋 For FREE GitHub accounts:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            export SHIPWRIGHT_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SHIPWRIGHT_TOKEN nor GITHUB_TOKEN is available"
            echo ""
            echo "📋 For FREE GitHub accounts - Setup Instructions:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            exit 1
          fi
        fi

        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*

        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SHIPWRIGHT_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc

        # Configure Git authentication with token
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Verify authentication setup
        echo "✅ Git and Go configured for private repos"
        echo "GOPRIVATE: $(go env GOPRIVATE)"

    - name: 'Create or verify tag'
      run: |
        echo "🏷️ Resolving tag ${{ needs.validate-release.outputs.tag }} for this release..."
        # Runs for every release path (tag push, CI-triggered automatic, and
        # a genuinely manual admin dispatch), not just "automatic" -- a
        # manual release is still a real release and must satisfy the same
        # Tag <-> Commit <-> Release invariant. For a tag-push, the tag
        # already exists at the checked-out commit, so this is a safe
        # same-commit no-op; for an admin dispatch with no pre-existing tag,
        # this is what actually creates it (nothing else in this workflow
        # does). There is no weaker, tag-optional release path.
        chmod +x scripts/release-tag-guard.sh
        scripts/release-tag-guard.sh "${{ needs.validate-release.outputs.tag }}"

    - name: 'Verify tag points to current commit'
      run: |
        TAG="${{ needs.validate-release.outputs.tag }}"
        CURRENT_COMMIT=$(git rev-parse HEAD)

        if ! git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
          echo "::error::Tag ${TAG} does not exist. A release must be backed by a real, resolvable tag pointing at the exact intended commit."
          exit 1
        fi

        TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
        if [ "$TAG_COMMIT" != "$CURRENT_COMMIT" ]; then
          echo "::error::Tag ${TAG} points to commit ${TAG_COMMIT} but current commit is ${CURRENT_COMMIT}"
          exit 1
        fi
        echo "✅ Tag ${TAG} correctly points to current commit ${CURRENT_COMMIT}"

    - name: 'Run GoReleaser'
      uses: 'goreleaser/goreleaser-action@v7'
      with:
        distribution: 'goreleaser'
        version: '2.18.0'
        args: 'release --clean'
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

    - name: 'Prepare raw binaries for direct download'
      run: |
        echo "📦 Preparing raw binaries for direct download..."
        mkdir -p raw-binaries

        # Extract binaries from archives and rename them
        cd dist

        # Process Linux binaries
        for file in shipwright_*_linux_amd64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" shipwright
            mv shipwright ../raw-binaries/shipwright-linux-amd64
            chmod +x ../raw-binaries/shipwright-linux-amd64
          fi
        done

        for file in shipwright_*_linux_arm64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" shipwright
            mv shipwright ../raw-binaries/shipwright-linux-arm64
            chmod +x ../raw-binaries/shipwright-linux-arm64
          fi
        done

        # Process Darwin (macOS) binaries
        for file in shipwright_*_darwin_amd64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" shipwright
            mv shipwright ../raw-binaries/shipwright-darwin-amd64
            chmod +x ../raw-binaries/shipwright-darwin-amd64
          fi
        done

        for file in shipwright_*_darwin_arm64.tar.gz; do
          if [ -f "$file" ]; then
            tar -xzf "$file" shipwright
            mv shipwright ../raw-binaries/shipwright-darwin-arm64
            chmod +x ../raw-binaries/shipwright-darwin-arm64
          fi
        done

        # Process Windows binaries
        for file in shipwright_*_windows_amd64.zip; do
          if [ -f "$file" ]; then
            unzip -q "$file" shipwright.exe
            mv shipwright.exe ../raw-binaries/shipwright-windows-amd64.exe
          fi
        done

        for file in shipwright_*_windows_arm64.zip; do
          if [ -f "$file" ]; then
            unzip -q "$file" shipwright.exe
            mv shipwright.exe ../raw-binaries/shipwright-windows-arm64.exe
          fi
        done

        cd ..
        echo "✅ Raw binaries prepared:"
        ls -lh raw-binaries/

    - name: 'Merge raw-binary checksums into checksums.txt'
      run: |
        echo "🔐 Adding raw-binary SHA-256 checksums to dist/checksums.txt"
        ( cd raw-binaries && sha256sum -- * ) >> dist/checksums.txt
        echo "Combined checksums.txt:"
        cat dist/checksums.txt

    - name: 'Setup GitHub CLI'
      run: |
        if ! command -v gh &> /dev/null; then
          echo "Installing GitHub CLI..."
          # Note: sudo is required for system package installation
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
        else
          echo "✅ GitHub CLI already installed"
        fi
        gh --version

    - name: 'Upload raw binaries to GitHub Release'
      run: |
        echo "Uploading raw binaries to GitHub Release..."
        cd raw-binaries

        # Upload each binary to the release
        for binary in *; do
          if [ -f "$binary" ]; then
            echo "Uploading $binary..."
            gh release upload "${{ needs.validate-release.outputs.tag }}" "$binary" --clobber
          fi
        done

        echo "Uploading combined checksums.txt..."
        gh release upload "${{ needs.validate-release.outputs.tag }}" "../dist/checksums.txt" --clobber

        echo "✅ Raw binaries uploaded successfully"
        echo ""
        echo "📦 Available binaries for download:"
        ls -lh
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

    - name: 'Verify published release (post-publish consumer verification)'
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      run: |
        chmod +x scripts/verify-release-asset.sh
        scripts/verify-release-asset.sh \
          "${{ needs.validate-release.outputs.tag }}" \
          "shipwright-linux-amd64" \
          "${{ needs.validate-release.outputs.version }}" \
          "${{ steps.provenance.outputs.sha }}"

    - name: 'Update CHANGELOG.md in repository'
      if: "needs.validate-release.outputs.type == 'automatic'"
      run: |
        echo "📝 Updating CHANGELOG.md in repository..."
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

        # NEW_CHANGELOG_ENTRY is passed via env (not interpolated into this
        # script) because it's built from commit messages -- untrusted
        # text. Interpolating it directly into the script would let a crafted
        # commit message break out of the script instead of just being data.
        printf '%s' "$NEW_CHANGELOG_ENTRY" > /tmp/new-changelog-entry.md

        chmod +x scripts/changelog-prepend-release.sh
        scripts/changelog-prepend-release.sh CHANGELOG.md /tmp/new-changelog-entry.md "$TAG"

        git add CHANGELOG.md
        if git diff --cached --quiet; then
          echo "ℹ️ CHANGELOG.md already up to date for ${TAG} -- nothing to commit."
        else
          git commit -m "docs: update CHANGELOG.md for ${TAG}"
          git push origin main
          echo "✅ CHANGELOG.md updated in repository"
        fi
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        TAG: '${{ needs.validate-release.outputs.tag }}'
        NEW_CHANGELOG_ENTRY: '${{ needs.validate-release.outputs.changelog }}'

    - name: 'Upload release artifacts'
      uses: 'actions/upload-artifact@v7'
      with:
        name: 'release-artifacts-${{ needs.validate-release.outputs.tag }}'
        path: |
          dist/*
          raw-binaries/*
        retention-days: 30

    - name: 'Release summary'
      run: |
        echo "🎉 Release ${{ needs.validate-release.outputs.tag }} created successfully!"
        echo "📦 Artifacts uploaded to GitHub Releases"
        echo "📝 Changelog generated and included"
        echo "🔗 Raw binaries available for direct download:"
        echo "   - shipwright-linux-amd64"
        echo "   - shipwright-linux-arm64"
        echo "   - shipwright-darwin-amd64"
        echo "   - shipwright-darwin-arm64"
        echo "   - shipwright-windows-amd64.exe"
        echo "   - shipwright-windows-arm64.exe"
        echo "✅ Post-publish verification passed: downloaded, checksum-verified, and executed"
