name: Release Pipeline

# This workflow runs when:
# 1. A tag is pushed to main (manual release)
# 2. Push to main branch (automatic release)
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Version tags (v1.0.0, v2.1.3, etc.)

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.1'
  BINARY_NAME: 'syntegrity-dagger'

jobs:
  # Job 1: Validate tag and prepare release
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        token: ${{ secrets.GORELEASER_CURRENT_TAG }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GORELEASER_CURRENT_TAG }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Determine release type and version
      id: tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Manual release via tag
          echo "🏷️ Manual release via tag: ${{ github.ref_name }}"
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "type=manual" >> $GITHUB_OUTPUT
        else
          # Automatic release via push to main
          echo "🚀 Automatic release via push to main"
          
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Extract version number
          VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
          echo "Version number: $VERSION_NUMBER"
          
          # Determine version bump based on commit messages
          COMMITS=$(git log --oneline $LATEST_TAG..HEAD)
          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"
          
          # Check for conventional commits
          if echo "$COMMITS" | grep -q "feat!:\|BREAKING CHANGE"; then
            # Major version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1+1".0.0"}')
            echo "Major version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "feat:"; then
            # Minor version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2+1".0"}')
            echo "Minor version bump: $VERSION"
          elif echo "$COMMITS" | grep -q "fix:"; then
            # Patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Patch version bump: $VERSION"
          else
            # Default to patch version bump
            VERSION=$(echo $VERSION_NUMBER | awk -F. '{print $1"."$2"."$3+1}')
            echo "Default patch version bump: $VERSION"
          fi
          
          TAG="v$VERSION"
          echo "type=automatic" >> $GITHUB_OUTPUT
        fi
        
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Release information determined: $TAG"
        
    - name: Generate changelog
      id: changelog
      run: |
        echo "📝 Generating changelog for release..."
        
        # Get previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        echo "Previous tag: $PREVIOUS_TAG"
        
        if [[ -n "$PREVIOUS_TAG" ]]; then
          # Generate changelog since previous tag
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
        else
          # Generate changelog for all commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=20)
        fi
        
        # Save changelog to file for GoReleaser
        echo "$CHANGELOG" > CHANGELOG.md
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Changelog generated for release"

  # Job 2: Build and test before release
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Build
      run: |
        echo "🔨 Building application..."
        go build -o ${{ env.BINARY_NAME }} .
        echo "✅ Build completed"
        
    - name: Run tests
      run: |
        echo "🧪 Running tests..."
        go test -v ./...
        echo "✅ Tests completed"
        
    - name: Run security scan
      run: |
        echo "🔒 Running security scan..."
        go vet ./...
        echo "✅ Security scan completed"

  # Job 3: Create release with GoReleaser
  create-release:
    runs-on: ubuntu-latest
    needs: [validate-release, build-and-test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GORELEASER_CURRENT_TAG }}
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Configure Git for private repos
      run: |
        git config --global url."https://${{ secrets.GORELEASER_CURRENT_TAG }}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Create tag (automatic release only)
      if: needs.validate-release.outputs.type == 'automatic'
      run: |
        echo "🏷️ Creating tag ${{ needs.validate-release.outputs.tag }} for automatic release..."
        
        # Create tag if it doesn't exist
        if ! git tag -l | grep -q "^${{ needs.validate-release.outputs.tag }}$"; then
          git tag -a "${{ needs.validate-release.outputs.tag }}" -m "Release ${{ needs.validate-release.outputs.tag }}"
          git push origin "${{ needs.validate-release.outputs.tag }}"
          echo "✅ Tag created and pushed: ${{ needs.validate-release.outputs.tag }}"
        else
          echo "⚠️ Tag already exists: ${{ needs.validate-release.outputs.tag }}"
        fi
        
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v5
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GORELEASER_CURRENT_TAG }}
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ needs.validate-release.outputs.tag }}
        path: dist/*
        retention-days: 30
        
    - name: Release summary
      run: |
        echo "🎉 Release ${{ needs.validate-release.outputs.tag }} created successfully!"
        echo "📦 Artifacts uploaded to GitHub Releases"
        echo "📝 Changelog generated and included"
