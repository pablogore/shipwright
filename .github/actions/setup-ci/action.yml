name: 'Setup CI Environment'
description: >-
  Checkout, install Go, configure Git/Go for private getsyntegrity modules,
  and restore the Go module cache. Extracted verbatim from the identical
  setup shared by ci.yml's setup/build/test/security jobs -- behavior-
  preserving, not a redesign of caching or private-module auth.

inputs:
  go-version:
    description: 'Go version to install (source of truth stays ci.yml env.GO_VERSION)'
    required: true
  cache-version:
    description: 'Cache key version suffix (source of truth stays ci.yml env.CACHE_VERSION)'
    required: true
  shipwright-token:
    description: 'Token with access to private getsyntegrity/* and gitlab.com/syntegrity/* repos (pass secrets.SHIPWRIGHT_TOKEN explicitly -- composite actions do not inherit secrets implicitly)'
    required: false
    default: ''
  github-token:
    description: 'Fallback token used when shipwright-token is empty (pass secrets.GITHUB_TOKEN explicitly)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@v7'
      with:
        # For PRs, checkout the PR head commit
        ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

    - name: 'Set up Go'
      uses: 'actions/setup-go@v7'
      with:
        go-version: '${{ inputs.go-version }}'
        cache: false  # Disable default cache to use our custom one

    - name: 'Configure Git and Go for private repos'
      shell: 'bash'
      env:
        SHIPWRIGHT_TOKEN: '${{ inputs.shipwright-token }}'
        GITHUB_TOKEN: '${{ inputs.github-token }}'
        GIT_TERMINAL_PROMPT: 0
      run: |
        # Use SHIPWRIGHT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
        if [ -z "$SHIPWRIGHT_TOKEN" ]; then
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "⚠️ SHIPWRIGHT_TOKEN not set, using GITHUB_TOKEN as fallback"
            echo "⚠️ Note: GITHUB_TOKEN may not have access to private organization repositories"
            echo "⚠️ For private repos, configure SHIPWRIGHT_TOKEN secret with a token that has 'repo' scope"
            echo ""
            echo "📋 For FREE GitHub accounts:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
            export SHIPWRIGHT_TOKEN="$GITHUB_TOKEN"
          else
            echo "❌ Error: Neither SHIPWRIGHT_TOKEN nor GITHUB_TOKEN is available"
            echo ""
            echo "📋 For FREE GitHub accounts - Setup Instructions:"
            echo "   1. Create a Personal Access Token (PAT) at: https://github.com/settings/tokens"
            echo "   2. Select scopes: 'repo' (full control of private repositories)"
            echo "   3. Add it as secret 'SHIPWRIGHT_TOKEN' in:"
            echo "      Repository Settings → Secrets and variables → Actions"
            echo "   4. The token must have access to: github.com/getsyntegrity/go-kit-logger"
            echo ""
            echo "💡 Why this is needed:"
            echo "   - GITHUB_TOKEN (default) does NOT have access to private organization repos"
            echo "   - Free accounts need a PAT with 'repo' scope for private repo access"
            exit 1
          fi
        fi

        # Configure Go to treat getsyntegrity repos as private
        go env -w GOPRIVATE=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOPROXY=github.com/getsyntegrity/*,gitlab.com/syntegrity/*
        go env -w GONOSUMDB=github.com/getsyntegrity/*,gitlab.com/syntegrity/*

        # Create .netrc file for authentication
        echo "machine github.com" > ~/.netrc
        echo "login x-access-token" >> ~/.netrc
        echo "password $SHIPWRIGHT_TOKEN" >> ~/.netrc
        chmod 600 ~/.netrc

        # Configure Git authentication with token (escape special characters)
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${SHIPWRIGHT_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Verify authentication setup
        echo "✅ Git and Go configured for private repos"
        echo "GOPRIVATE: $(go env GOPRIVATE)"
        echo "Git URL config:"
        git config --global --get-regexp url || echo "No URL config found"

    - name: 'Cache Go modules'
      uses: 'actions/cache@v6'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: "go-mod-${{ hashFiles('go.sum') }}-${{ inputs.cache-version }}-${{ runner.os }}"
        restore-keys: |
          go-mod-${{ hashFiles('go.sum') }}-${{ inputs.cache-version }}-
          go-mod-${{ hashFiles('go.sum') }}-
          go-mod-
        fail-on-cache-miss: false
