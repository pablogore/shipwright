name: 'Shipwright'
description: 'Execute a Shipwright workflow manifest in GitHub Actions'
branding:
  icon: 'play-circle'
  color: 'blue'

inputs:
  version:
    description: 'Version of shipwright to use (e.g., "latest", "v1.0.0")'
    required: false
    default: 'latest'
  workflow:
    description: 'Path to the declarative workflow manifest'
    required: false
    default: '.shipwright/workflow.yaml'
  step:
    description: 'Workflow step to execute (the needs-transitive closure of this step id). Leave empty to run every step'
    required: false
    default: ''
  list-steps:
    description: 'List the workflow steps declared in the manifest instead of executing'
    required: false
    default: 'false'
  branch:
    description: 'Branch name'
    required: false
    default: 'develop'
  executor:
    description: 'Executor to use: native, docker (empty for auto-detection)'
    required: false
    default: ''
  config:
    description: 'Path to configuration file'
    required: false
    default: '.shipwright.yml'
  env:
    description: 'Environment (dev, staging, prod)'
    required: false
    default: 'dev'
  coverage:
    description: 'Minimum coverage percentage required'
    required: false
    default: '90'
  skip-cache:
    description: 'Skip binary caching (useful for testing)'
    required: false
    default: 'false'
  verbose:
    description: 'Enable verbose logging'
    required: false
    default: 'false'
  git-ref:
    description: 'Git reference to use (branch, tag, commit)'
    required: false
    default: ''
  git-auth:
    description: 'Git authentication method (ssh or https)'
    required: false
    default: 'https'

outputs:
  binary-path:
    description: 'Path to the shipwright binary'
    value: '${{ steps.setup.outputs.binary-path }}'
  version:
    description: 'Version of shipwright used'
    value: '${{ steps.setup.outputs.version }}'
  exit-code:
    description: 'Exit code from shipwright execution'
    value: '${{ steps.execute.outputs.exit-code }}'

runs:
  using: 'composite'
  steps:
    - name: 'Set up Docker Buildx'
      uses: 'docker/setup-buildx-action@v3'

    - name: 'Verify Docker is available'
      shell: 'bash'
      run: |
        echo "🐳 Verifying Docker is available..."
        if ! docker info > /dev/null 2>&1; then
          echo "❌ Docker is not running"
          exit 1
        fi
        echo "✅ Docker is available (version: $(docker --version))"

    - name: 'Determine binary URL'
      id: 'binary-url'
      shell: 'bash'
      run: |
        VERSION="${{ inputs.version }}"
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"

        # Normalize architecture
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        # Normalize OS
        case "$OS" in
          darwin) OS="darwin" ;;
          linux) OS="linux" ;;
          *) OS="linux" ;;
        esac

        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/pablogore/shipwright/releases/latest/download/shipwright-${OS}-${ARCH}"
        else
          URL="https://github.com/pablogore/shipwright/releases/download/${VERSION}/shipwright-${OS}-${ARCH}"
        fi

        echo "url=$URL" >> $GITHUB_OUTPUT
        echo "os=$OS" >> $GITHUB_OUTPUT
        echo "arch=$ARCH" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 'Cache Shipwright binary'
      id: 'cache-binary'
      if: "inputs.skip-cache != 'true'"
      uses: 'actions/cache@v4'
      with:
        path: '${{ runner.tool_cache }}/shipwright'
        key: 'shipwright-${{ steps.binary-url.outputs.version }}-${{ steps.binary-url.outputs.os }}-${{ steps.binary-url.outputs.arch }}'
        restore-keys: |
          shipwright-${{ steps.binary-url.outputs.version }}-${{ steps.binary-url.outputs.os }}-
          shipwright-${{ steps.binary-url.outputs.version }}-
          shipwright-

    - name: 'Setup Shipwright'
      id: 'setup'
      shell: 'bash'
      run: |
        BINARY_NAME="shipwright"
        CACHE_DIR="${{ runner.tool_cache }}/shipwright"
        BINARY_PATH="./${BINARY_NAME}"

        # Try to use cached binary first
        if [ "${{ inputs.skip-cache }}" != "true" ] && [ "${{ steps.cache-binary.outputs.cache-hit }}" = "true" ]; then
          if [ -f "${CACHE_DIR}/${BINARY_NAME}" ]; then
            echo "✅ Using cached binary"
            cp "${CACHE_DIR}/${BINARY_NAME}" "${BINARY_PATH}"
            chmod +x "${BINARY_PATH}"
          fi
        fi

        # Download if not cached or cache disabled
        if [ ! -f "${BINARY_PATH}" ] || [ ! -x "${BINARY_PATH}" ]; then
          echo "📥 Downloading Shipwright from ${{ steps.binary-url.outputs.url }}"
          curl -L "${{ steps.binary-url.outputs.url }}" -o "${BINARY_PATH}" || {
            echo "❌ Failed to download binary"
            exit 1
          }
          chmod +x "${BINARY_PATH}"

          # Save to cache if caching is enabled
          if [ "${{ inputs.skip-cache }}" != "true" ]; then
            mkdir -p "${CACHE_DIR}"
            cp "${BINARY_PATH}" "${CACHE_DIR}/${BINARY_NAME}"
          fi
        fi

        # Verify binary works
        INSTALLED_VERSION=$("${BINARY_PATH}" --version 2>&1 | head -n1 | awk '{print $3}' || echo "unknown")
        echo "✅ Shipwright $INSTALLED_VERSION ready"
        echo "binary-path=${BINARY_PATH}" >> $GITHUB_OUTPUT
        echo "version=$INSTALLED_VERSION" >> $GITHUB_OUTPUT

    - name: 'Ensure Docker and Dagger daemon are ready'
      shell: 'bash'
      run: |
        echo "🐳 Verifying Docker is available..."
        if ! docker info > /dev/null 2>&1; then
          echo "❌ Docker is not running"
          exit 1
        fi
        echo "✅ Docker is available (version: $(docker --version))"

        # shipwright uses Dagger internally, which requires the Dagger daemon
        # The daemon will be started automatically by shipwright when needed
        # We just need to ensure Docker is available
        echo "✅ Docker is ready - shipwright will handle Dagger daemon startup"

    - name: 'Execute Workflow'
      id: 'execute'
      shell: 'bash'
      run: |
        set +e  # Don't fail immediately, we want to capture exit code

        echo "::group::Executing workflow: ${{ inputs.workflow }}"
        echo "🌍 Environment: GitHub Actions"
        echo "📋 Workflow: ${{ inputs.workflow }}"

        CMD="${{ steps.setup.outputs.binary-path }}"
        CMD="$CMD --workflow=${{ inputs.workflow }}"
        CMD="$CMD --config=${{ inputs.config }}"
        CMD="$CMD --env=${{ inputs.env }}"
        CMD="$CMD --coverage=${{ inputs.coverage }}"
        CMD="$CMD --branch=${{ inputs.branch }}"

        # Auto-detect CI environment - don't use --local in CI
        # The binary will automatically detect CI via environment variables

        if [ "${{ inputs.list-steps }}" = "true" ]; then
          CMD="$CMD --list-steps"
        elif [ -n "${{ inputs.step }}" ]; then
          CMD="$CMD --step=${{ inputs.step }}"
        fi

        if [ -n "${{ inputs.executor }}" ]; then
          CMD="$CMD --executor=${{ inputs.executor }}"
        fi

        if [ "${{ inputs.verbose }}" = "true" ]; then
          CMD="$CMD --verbose"
        fi

        if [ -n "${{ inputs.git-ref }}" ]; then
          CMD="$CMD --git-ref=${{ inputs.git-ref }}"
        else
          # Use GitHub ref if available
          if [ -n "${{ github.ref }}" ]; then
            CMD="$CMD --git-ref=${{ github.ref_name }}"
          fi
        fi

        if [ -n "${{ inputs.git-auth }}" ]; then
          CMD="$CMD --git-auth=${{ inputs.git-auth }}"
        else
          # Default to HTTPS in GitHub Actions
          CMD="$CMD --git-auth=https"
        fi

        echo "Running: $CMD"
        eval "$CMD"
        EXIT_CODE=$?

        echo "::endgroup::"
        echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT

        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::Workflow ${{ inputs.workflow }} failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi
