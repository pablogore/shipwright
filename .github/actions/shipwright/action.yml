name: 'Shipwright'
description: 'Execute a Shipwright workflow manifest in GitHub Actions'
branding:
  icon: 'play-circle'
  color: 'blue'

inputs:
  version:
    description: >-
      Pinned Shipwright release tag to run (e.g. "v1.2.3"). Required --
      there is no default and "latest" is rejected, so a new Shipwright
      release can never silently change what a workflow runs. The binary is
      downloaded from this exact tag's GitHub Release and SHA256-verified
      against that release's checksums.txt before it is ever executed.
    required: true
  workflow:
    description: 'Path to the declarative workflow manifest'
    required: false
    default: '.shipwright/workflow.yaml'
  step:
    description: 'Workflow step to execute (the needs-transitive closure of this step id). Leave empty to run every step'
    required: false
    default: ''
  list-steps:
    description: 'List the workflow steps declared in the manifest instead of executing'
    required: false
    default: 'false'
  branch:
    description: 'Branch name'
    required: false
    default: 'develop'
  executor:
    description: 'Executor to use: native, docker (empty for auto-detection)'
    required: false
    default: ''
  config:
    description: 'Path to configuration file'
    required: false
    default: '.shipwright.yml'
  env:
    description: 'Environment (dev, staging, prod)'
    required: false
    default: 'dev'
  coverage:
    description: 'Minimum coverage percentage required'
    required: false
    default: '90'
  skip-cache:
    description: 'Skip binary caching (useful for testing)'
    required: false
    default: 'false'
  verbose:
    description: 'Enable verbose logging'
    required: false
    default: 'false'
  git-ref:
    description: 'Git reference to use (branch, tag, commit)'
    required: false
    default: ''
  git-auth:
    description: 'Git authentication method (ssh or https)'
    required: false
    default: 'https'
  cloud-token:
    description: >-
      Dagger Cloud token (from a Dagger Cloud org's Tokens page). Optional —
      leave empty to run with a local, per-job Dagger engine (today's
      default: fast within one job via CacheVolume, but every GitHub-hosted
      runner starts a fresh Docker daemon, so that engine and its caches
      never survive between jobs or runners). Setting this connects the job
      to Dagger Cloud's distributed cache instead, so a registry/target
      cache warmed by one job is available to the next job even on a
      different runner. Pass it from the calling workflow's `with:` block,
      sourcing the value from a secret such as `DAGGER_CLOUD_TOKEN`.
    required: false
    default: ''

outputs:
  binary-path:
    description: 'Path to the shipwright binary'
    value: '${{ steps.setup.outputs.binary-path }}'
  version:
    description: 'The resolved, checksum- and version-verified release tag that was executed'
    value: '${{ steps.setup.outputs.version }}'
  exit-code:
    description: 'Exit code from shipwright execution'
    value: '${{ steps.execute.outputs.exit-code }}'

runs:
  using: 'composite'
  steps:
    - name: 'Set up Docker Buildx'
      uses: 'docker/setup-buildx-action@v3'

    - name: 'Verify Docker is available'
      shell: 'bash'
      run: |
        echo "🐳 Verifying Docker is available..."
        if ! docker info > /dev/null 2>&1; then
          echo "❌ Docker is not running"
          exit 1
        fi
        echo "✅ Docker is available (version: $(docker --version))"

    - name: 'Validate version input'
      id: 'version'
      shell: 'bash'
      env:
        VERSION: '${{ inputs.version }}'
      run: '${{ github.action_path }}/lib/validate-version.sh "$VERSION"'

    - name: 'Resolve platform'
      id: 'platform'
      shell: 'bash'
      run: |
        "${{ github.action_path }}/lib/resolve-platform.sh" "$(uname -s)" "$(uname -m)"

    - name: 'Determine release URLs'
      id: 'urls'
      shell: 'bash'
      env:
        VERSION: '${{ steps.version.outputs.version }}'
        BINARY: '${{ steps.platform.outputs.binary }}'
      run: |
        echo "url=https://github.com/pablogore/shipwright/releases/download/${VERSION}/${BINARY}" >> "$GITHUB_OUTPUT"
        echo "checksums-url=https://github.com/pablogore/shipwright/releases/download/${VERSION}/checksums.txt" >> "$GITHUB_OUTPUT"

    - name: 'Cache Shipwright binary'
      id: 'cache-binary'
      if: "inputs.skip-cache != 'true'"
      uses: 'actions/cache@v4'
      with:
        path: '${{ runner.tool_cache }}/shipwright'
        # Scoped to (version, os, arch) only -- no restore-keys. A prefix
        # fallback could hand back a binary for a different version, OS, or
        # arch than requested; downstream verification (checksum + reported
        # version) would still catch that, but it's simpler to never offer a
        # mismatched cache entry in the first place.
        key: 'shipwright-${{ steps.version.outputs.version }}-${{ steps.platform.outputs.os }}-${{ steps.platform.outputs.arch }}'

    - name: 'Download and verify Shipwright'
      id: 'setup'
      shell: 'bash'
      env:
        BINARY_NAME: '${{ steps.platform.outputs.binary }}'
        BINARY_URL: '${{ steps.urls.outputs.url }}'
        CHECKSUMS_URL: '${{ steps.urls.outputs.checksums-url }}'
        VERSION: '${{ steps.version.outputs.version }}'
        SKIP_CACHE: '${{ inputs.skip-cache }}'
        CACHE_HIT: '${{ steps.cache-binary.outputs.cache-hit }}'
      run: |
        CACHE_DIR="${{ runner.tool_cache }}/shipwright"
        BINARY_PATH="./${BINARY_NAME}"

        if [ "$SKIP_CACHE" != "true" ] && [ "$CACHE_HIT" = "true" ] && [ -f "${CACHE_DIR}/${BINARY_NAME}" ]; then
          echo "📦 Found cached binary -- verifying its checksum before use (a cache hit is never trusted blindly)"
          cp "${CACHE_DIR}/${BINARY_NAME}" "${BINARY_PATH}"
        else
          echo "📥 Downloading Shipwright ${VERSION} from ${BINARY_URL}"
          curl -fsSL "${BINARY_URL}" -o "${BINARY_PATH}"
        fi
        chmod +x "${BINARY_PATH}"

        echo "📥 Downloading checksums.txt from ${CHECKSUMS_URL}"
        curl -fsSL "${CHECKSUMS_URL}" -o ./checksums.txt

        "${{ github.action_path }}/lib/verify-checksum.sh" ./checksums.txt "${BINARY_PATH}" "${BINARY_NAME}"

        if [ "$SKIP_CACHE" != "true" ]; then
          mkdir -p "${CACHE_DIR}"
          cp "${BINARY_PATH}" "${CACHE_DIR}/${BINARY_NAME}"
        fi

        "${{ github.action_path }}/lib/verify-cli-version.sh" "${BINARY_PATH}" "${VERSION}"

        echo "✅ Shipwright ${VERSION} downloaded, checksum-verified, and version-verified"
        echo "binary-path=${BINARY_PATH}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: 'Ensure Docker and Dagger daemon are ready'
      shell: 'bash'
      run: |
        echo "🐳 Verifying Docker is available..."
        if ! docker info > /dev/null 2>&1; then
          echo "❌ Docker is not running"
          exit 1
        fi
        echo "✅ Docker is available (version: $(docker --version))"

        # shipwright uses Dagger internally, which requires the Dagger daemon
        # The daemon will be started automatically by shipwright when needed
        # We just need to ensure Docker is available
        echo "✅ Docker is ready - shipwright will handle Dagger daemon startup"

    - name: 'Execute Workflow'
      id: 'execute'
      shell: 'bash'
      env:
        # Empty string is treated as "unset" by the Dagger CLI, so this is
        # safe to always pass through — jobs that don't set inputs.cloud-token
        # keep today's local-engine-only behavior unchanged.
        DAGGER_CLOUD_TOKEN: '${{ inputs.cloud-token }}'
        BINARY_PATH: '${{ steps.setup.outputs.binary-path }}'
        WORKFLOW: '${{ inputs.workflow }}'
        CONFIG: '${{ inputs.config }}'
        ENV: '${{ inputs.env }}'
        COVERAGE: '${{ inputs.coverage }}'
        BRANCH: '${{ inputs.branch }}'
        LIST_STEPS: '${{ inputs.list-steps }}'
        STEP: '${{ inputs.step }}'
        EXECUTOR: '${{ inputs.executor }}'
        VERBOSE: '${{ inputs.verbose }}'
        GIT_REF: '${{ inputs.git-ref }}'
        GIT_AUTH: '${{ inputs.git-auth }}'
        FALLBACK_GIT_REF: '${{ github.ref_name }}'
      run: |
        set +e  # Don't fail immediately, we want to capture exit code

        echo "::group::Executing workflow: ${WORKFLOW}"
        echo "🌍 Environment: GitHub Actions"
        echo "📋 Workflow: ${WORKFLOW}"

        # Use GitHub ref if the caller didn't set one explicitly.
        if [ -z "$GIT_REF" ]; then
          GIT_REF="$FALLBACK_GIT_REF"
        fi
        # Default to HTTPS if the caller cleared it (inputs.git-auth already
        # defaults to 'https', this only guards an explicit empty override).
        if [ -z "$GIT_AUTH" ]; then
          GIT_AUTH="https"
        fi
        export WORKFLOW CONFIG ENV COVERAGE BRANCH LIST_STEPS STEP EXECUTOR VERBOSE GIT_REF GIT_AUTH

        # build-args.sh prints one argv element per line; mapfile turns that
        # back into a real bash array, so every value below reaches the CLI
        # as inert, single-argument data -- never through eval or any other
        # shell re-parsing step.
        mapfile -t ARGS < <("${{ github.action_path }}/lib/build-args.sh")

        echo "Running: ${BINARY_PATH} ${ARGS[*]}"
        "${BINARY_PATH}" "${ARGS[@]}"
        EXIT_CODE=$?

        echo "::endgroup::"
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::Workflow ${WORKFLOW} failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi
