# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  # Go module updates - consolidated configuration
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # Security updates - grouped for daily processing
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      # Minor and patch updates - grouped for weekly processing
      minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Major updates - grouped for weekly processing with manual review
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"

  # .dagger is its own Go module (intentionally pinned to a different Go
  # version than root for Dagger toolchain compatibility) and is not
  # reachable through the root "/" directory above, so its dependencies
  # (e.g. google.golang.org/grpc, golang.org/x/net, otel exporters) were
  # never getting security-update PRs despite GitHub flagging them as
  # vulnerable.
  - package-ecosystem: "gomod"
    directory: "/.dagger"
    target-branch: "develop"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
