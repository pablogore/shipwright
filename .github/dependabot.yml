# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
registries:
  github-ep:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.SYNTEGRITY_DAGGER_TOKEN}}

updates:
  # Go module updates - consolidated configuration
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    registries:
      - github-ep
    groups:
      # Security updates - grouped for daily processing
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      # Minor and patch updates - grouped for weekly processing
      minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "github.com/getsyntegrity/*"  # Exclude private repos from auto-updates
      # Major updates - grouped for weekly processing with manual review
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
        exclude-patterns:
          - "github.com/getsyntegrity/*"  # Exclude private repos from auto-updates
